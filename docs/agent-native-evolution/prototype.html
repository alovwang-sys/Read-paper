<script>
const $=id=>document.getElementById(id), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=(name)=>({spark:'<svg viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg>',arrow:'<svg viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>',doc:'<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM15 3v5h4M9 12h7M9 16h5"/></svg>',back:'<svg viewBox="0 0 24 24"><path d="M19 12H5m5-5-5 5 5 5"/></svg>',link:'<svg viewBox="0 0 24 24"><path d="m9 15 6-6M8 17l-1 1a4 4 0 0 1-5-5l4-4a4 4 0 0 1 5 0m2-2 1-1a4 4 0 0 1 5 5l-4 4a4 4 0 0 1-5 0"/></svg>'}[name]||'');
const sources=[
{id:'a',title:'实验记录 A：相关材料与检索数量',topic:'相关性与数量',page:4,quote:'在相关信息比例保持不变时，增加材料数量带来的变化，与降低相关信息比例带来的变化，应当分别比较。',body:'我们分别控制检索材料的数量与相关信息比例。数量增加并不必然使结果变差；当无关材料比例上升时，模型需要更强的区分能力。本记录只能说明本组样例条件下的表现，不能推广为全部模型的统一规律。',year:'2025',kind:'PDF · 示例原文'},
{id:'b',title:'实验记录 B：有效信息的位置',topic:'信息位置',page:7,quote:'相同的证据出现在上下文的不同位置时，回答可靠性发生变化；该结果不能单独解释为材料总量的作用。',body:'在本组样例中，我们固定材料内容，将关键证据放在开头、中间与末尾。不同位置的回答差异提示：除了数量与相关性，还需要对齐信息位置后再比较。此处没有检验所有上下文长度。',year:'2025',kind:'PDF · 示例原文'},
{id:'c',title:'实验记录 C：冲突材料与证据取舍',topic:'冲突与来源',page:5,quote:'当来源之间存在冲突时，材料增加可能放大取舍问题。回答应指出冲突条件，而不是仅依据材料数量选择结论。',body:'本组样例引入了结论互相冲突的材料。研究者需要核查冲突来自数据集、实验设定还是来源质量。增加材料与增加可靠证据不是一回事，不能仅凭多数材料支持就判定论断成立。',year:'2025',kind:'PDF · 示例原文'},
{id:'d',title:'研究备忘：待补充的跨模型实验',topic:'待核查缺口',page:null,quote:'目前只有题录和人工概述，没有可核对的全文。',body:'这条资料仅用于提示后续研究方向，没有 PDF 原文，不能用来支持页码引用。',year:'2026',kind:'题录 · 未有全文'}
];
const legacyItems=[{id:'old-card',title:'变量应该怎样分开比较？',type:'卡片',body:'研究笔记：先控制相关性，再单独比较检索材料数量。保留来源和实验条件，避免把多个变量归成一个原因。'},{id:'old-board',title:'上周的检索条件图',type:'白板',body:'旧白板中的卡片、论文和形状仍能找回。这里可打开统一画布的固定样例。'},{id:'old-draft',title:'证据综述草稿',type:'文稿',body:'已有文稿：检索数量不能独立说明回答质量。后续需补充任务和模型条件的比较。这是一份可继续修改的旧工作。'}];
const rowDefs=[
{id:'r1',title:'先区分“材料数量”和“相关性”',source:'a',text:'材料更多，并不直接意味着回答更不可靠。需要分别比较材料总量与无关信息比例：若相关性同时下降，就不能把全部影响归因于数量。'},
{id:'r2',title:'关键信息放在哪里，也会改变结果',source:'b',text:'在材料内容相同时，关键证据所在的位置仍可能影响回答。比较两项结果前，应先对齐信息位置和上下文长度，避免把位置效应误当成数量效应。'},
{id:'r3',title:'有分歧时，先核对实验条件与来源',source:'c',text:'当材料互相冲突时，“找得更多”可能增加取舍难度。应把实验设定、数据和来源可靠性列出来，再解释哪些条件支持或限制当前结论。'}
];
const state={title:'新研究',view:'welcome',documents:['a','b','c'],rows:[],busy:false,stopped:false,progress:0,runToken:0,focus:null,selection:null,reference:null,source:'a',history:[],shortAnswer:null,shortCollapsed:false,lastChange:null,version:1,returnPosition:null,libraryFilter:'all',search:'',drawingTool:'select',canvasNotes:[],runStatus:'',draftTarget:null,pdfSource:null,legacyId:null,referenceOrigin:null};
let toastTimer;
function notify(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function closeDrawer(){$('sidebar').classList.remove('open');$('drawer-shade').classList.remove('open');syncDrawer()}

function updateChrome(){ $('project-title').textContent=state.title;$('current-title').textContent=state.title;$('materials-btn').querySelector('span').textContent='本研究资料 · '+state.documents.length;$('export-btn').classList.toggle('hidden',state.view==='welcome');$('workspace').classList.toggle('welcome',state.view==='welcome');$('workspace').classList.toggle('has-short',!!state.shortAnswer);$('workspace').classList.toggle('has-reference',!!state.reference);$('agent-input').placeholder=state.focus?'围绕这一处，继续问或提出修改……':state.view==='welcome'?'告诉我你想弄清什么……':'继续本研究，或告诉我哪里需要修改……';$('recent-nav').innerHTML=state.rows.length?'<button class="'+(state.view==='result'?'active':'')+'" data-action="result">'+svg('doc')+'<span>检索材料与回答可靠性</span></button><button class="'+(state.view==='canvas'?'active':'')+'" data-action="canvas">'+svg('link')+'<span>证据关系</span></button>':'<div class="recent-empty">开始后，你的工作会留在这里。</div>';const fc=$('focus-chip');fc.classList.toggle('hidden',!state.focus);if(state.focus)fc.querySelector('span').textContent=state.focus.label;$('send-btn').classList.toggle('stopping',state.busy);$('send-btn').setAttribute('aria-label',state.busy?'停止本次研究':'发送研究指令');$('send-btn').innerHTML=state.busy?'<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>':'<svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>';renderStatus();}
function renderStatus(){const line=$('run-line');line.className='run-line'+(!state.busy?' finished':'');if(state.busy)line.innerHTML='<i class="pulse"></i><span>'+esc(state.runStatus)+'</span><button class="text-btn" data-action="history">查看过程</button>';else if(state.stopped)line.innerHTML='<span>已停止 · 已完成的 '+state.rows.length+' 项内容已保留</span><button class="text-btn" data-action="continue">继续研究</button>';else if(state.rows.length&&state.view==='pdf')line.innerHTML='<span>已完成比较初稿 · 阅读位置已保留</span><button class="text-btn" data-action="return-result">打开成果 →</button>';else if(state.rows.length)line.innerHTML='<span>初稿已留在本研究 · 可直接编辑</span>';else line.innerHTML='';$('short-answer').innerHTML=state.shortAnswer?'<details class="short-answer"'+(state.shortCollapsed?'':' open')+'><summary>围绕刚才的问题 '+(state.shortAnswer.target?'· '+esc(state.shortAnswer.target):'')+'</summary><p>'+esc(state.shortAnswer.text)+'</p></details>':'';}
function rowMarkup(row,index){const s=sources.find(s=>s.id===row.source);return '<article class="comparison-row '+(state.selection===row.id?'selected':'')+'" data-row="'+row.id+'"><div class="row-heading"><span class="row-index">0'+(index+1)+'</span><h3>'+esc(row.title)+'</h3>'+'</div><div class="editable" contenteditable="true" role="textbox" aria-label="编辑第'+(index+1)+'项比较" data-edit="'+row.id+'" spellcheck="false">'+esc(row.text)+'</div><div class="row-footer"><button class="citation" data-action="citation" data-source="'+row.source+'" data-rowid="'+row.id+'">'+svg('doc')+esc(s.topic)+' · p.'+s.page+'</button><span class="edit-hint">'+(row.edited?'你已编辑 · 原文引用':'AI 初稿 · 原文引用')+'</span><button class="ask" data-action="ask-row" data-rowid="'+row.id+'">'+svg('spark')+'围绕这里追问</button></div>'+(row.conflict?conflictMarkup(row):'')+'</article>'}
function conflictMarkup(row){const c=row.conflict;return '<div class="conflict" data-conflict="'+row.id+'"><h4>这里包含你的修改 · 先核对，再决定是否替换</h4><p class="before">'+esc(c.before)+'</p><p class="after">'+esc(c.after)+'</p>'+(c.stale?'<p>你刚才又修改了正文，差异已更新。请重新核对后应用。</p>':'')+'<div class="actions"><button class="btn primary" data-action="apply-change" data-rowid="'+row.id+'">采用建议</button><button class="btn" data-action="keep-edit" data-rowid="'+row.id+'">保留我的</button></div></div>'}
function renderContent(){const content=$('content');if(state.view==='welcome'){content.innerHTML='<div class="empty"><div class="empty-mark">'+svg('spark')+'</div><h1>你想研究什么？</h1><p>从一个问题开始。取证、比较和整理，交给 Agent 推进。</p><button class="example" data-action="example">'+svg('arrow')+'比较这些论文：材料变多时，<br>回答在什么条件下反而更不可靠？</button><button class="add" data-action="materials">＋ 添加资料'+(state.documents.length?' · 已备好 '+state.documents.length+' 份示例':'')+'</button></div>';}else if(state.view==='result'){content.innerHTML='<div class="document"><div class="result-header"><h1>材料更多，回答就会更可靠吗？</h1><p class="subtitle">把数量、相关性与信息位置分开，才能解释结论的边界。</p><div class="result-meta"><span class="tag">AI 初稿</span><span class="coverage"><i></i>原文 '+Math.min(state.rows.length,3)+' / 3 份</span><span>·</span><span>'+state.rows.length+' 项比较</span><span>·</span><span>固定示例，待真实研究验证</span><button class="text-btn" data-action="canvas">查看关系 ↗</button>'+(state.lastChange?'<button class="text-btn" data-action="undo">撤销本次修改</button>':'')+'</div></div><p class="summary">'+(state.rows.length===3?'当前最值得保留的判断是：不要仅用“检索了多少篇”衡量回答质量。三份示例记录分别提示了相关性、位置与冲突条件，应逐项核查。':'正在把已读取的证据整理在这里。你可以先查看已完成的部分。')+'</p><div class="section-title"><h2>条件与证据</h2><span class="rule"></span></div><div class="comparison">'+state.rows.map(rowMarkup).join('')+'</div>'+(state.rows.length===3?'<div class="gap">还缺什么：这里没有跨模型、跨任务的系统比较。当前结果不能推广成“增加材料必然有害”，也不能把例文当作真实文献结论。</div><p class="conclusion"><strong>下一步可以直接继续：</strong>点某一项“围绕这里追问”，再说“重新比较这一处”，可查看修订过程。</p>':'')+'</div>';}else if(state.view==='legacy'){const item=legacyItems.find(i=>i.id===state.legacyId);content.innerHTML='<div class="document"><button class="restore-btn" data-action="'+(state.rows.length?'result':'welcome')+'">'+svg('back')+'返回研究工作面</button><div class="eyebrow">'+esc(item.type)+' · 已有内容</div><h1>'+esc(item.title)+'</h1><p class="summary">'+esc(item.body)+'</p>'+(item.type==='白板'?'<button class="btn" data-action="canvas">打开关系画布</button>':'<p class="subtitle">通过查找和资料浏览，可以找回旧卡片与文稿，无需重新分类搬运。</p>')+'</div>';}else if(state.view==='pdf'){const s=sources.find(s=>s.id===state.pdfSource);content.innerHTML='<div class="document"><div class="pdf-toolbar"><button class="text-btn line" data-action="return-result">'+svg('back')+'返回比较结果 · 第'+state.returnPosition.index+'项</button><span>示例原文</span><span>p.'+s.page+'</span></div><article class="pdf-paper"><h1>'+esc(s.title)+'</h1><div class="authors">Papertrail 合成研究样例 · '+s.year+'</div><p class="small">本页为交互设计使用的合成文字，非真实论文 PDF。</p><h2>1. 研究设定</h2><p>'+esc(s.body)+'</p><h2>2. 观察与边界</h2><p><mark>'+esc(s.quote)+'</mark></p><p>需要比较实验条件、保留限制，并在真实研究中重新核查完整来源。本页仅用于验证阅读、定位、追问和返回的交互。</p><div class="page-no">'+s.page+'</div></article><div class="pdf-ask"><button class="text-btn line" data-action="ask-source">'+svg('spark')+'围绕这段原文追问</button></div></div>';}else renderCanvas();updateChrome();}
function renderCanvas(){ $('content').innerHTML='<div class="document"><button class="restore-btn" data-action="result">'+svg('back')+'返回比较结果</button><div class="canvas-header"><h1>把条件连起来看</h1><span class="grow"></span><span class="tag">同一画布 · 固定示例</span></div><p class="subtitle">卡片保留内容与出处，图形用来表达你的思考。</p><div class="canvas-tools" aria-label="画布工具"><button class="'+(state.drawingTool==='select'?'active':'')+'" data-action="canvas-tool" data-tool="select" aria-label="选择工具"><svg viewBox="0 0 24 24"><path d="m5 3 14 10-8 1-3 7z"/></svg></button><button data-action="canvas-tool" data-tool="text" aria-label="文字工具"><svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v15M9 20h6"/></svg></button><button data-action="canvas-add" aria-label="新增卡片">'+svg('doc')+'</button><button data-action="canvas-tool" data-tool="shape" aria-label="形状工具"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button><button data-action="canvas-tool" data-tool="pen" aria-label="画笔工具"><svg viewBox="0 0 24 24"><path d="m5 15 11-11 4 4L9 19l-5 1zM13 7l4 4"/></svg></button><button data-action="canvas-tool" data-tool="connect" aria-label="连线工具"><svg viewBox="0 0 24 24"><path d="M4 17 20 7m-7-2 7 2-2 7"/></svg></button></div><div class="canvas" id="canvas"><div class="canvas-scene"><svg class="canvas-lines" viewBox="0 0 780 455"><path d="M258 165C307 165 302 110 352 110M258 200C310 200 302 311 356 311"/><path class="hand" d="M597 119C651 117 610 191 635 191"/></svg><span class="canvas-label" style="left:284px;top:117px">拆分条件</span><span class="canvas-label" style="left:281px;top:268px">原文来源</span><span class="canvas-label" style="left:615px;top:113px">手绘</span><div class="canvas-card"><small>研究问题</small><h3>材料更多，回答就会更可靠吗？</h3><p>把相关性、数量与位置分别核查。</p><button class="text-btn" data-action="canvas-ask">围绕这张卡片追问 ↗</button></div><div class="canvas-card"><small>观点卡片 · 引用同一内容</small><h3>'+esc(state.rows[0]?.title||rowDefs[0].title)+'</h3><p>'+esc((state.rows[0]?.text||rowDefs[0].text).slice(0,66))+'…</p><button class="text-btn" data-action="ask-row" data-rowid="r1">围绕这里追问 ↗</button></div><div class="canvas-card paper"><small>论文 · 示例原文</small><h3>实验记录 A</h3><p>相关材料与检索数量</p><button class="citation" data-action="citation" data-source="a" data-rowid="r1">查看 p.4 原文 ↗</button></div><div class="canvas-note">还要核查<br>跨模型差异</div>'+state.canvasNotes.map((t,i)=>'<div class="canvas-new" style="left:'+35+'px;top:'+(320+i*55)+'px">'+esc(t)+'</div>').join('')+'</div></div></div>';}
function setFocus(focus){state.focus=focus;state.shortAnswer=null;updateChrome();$('agent-input').focus()}
function selectRow(id){state.selection=id;document.querySelectorAll('[data-row]').forEach(el=>el.classList.toggle('selected',el.dataset.row===id))}
function runCompare(resume=false){$('toast').classList.add('hidden');if(state.title==='新研究'||state.title==='未命名研究')state.title='检索与回答可靠性';if(!state.documents.length){state.shortAnswer={text:'本研究还没有资料。先加入示例资料，就能查看一轮从取证到比较初稿的完整过程。'};openReference('materials');renderStatus();return}state.view='result';state.busy=true;state.stopped=false;state.shortAnswer=null;state.focus=null;const token=++state.runToken;renderContent();const steps=['正在查找本研究的相关资料','已找到 3 份资料，正在读取例文 A 的相关页','已整理 1 项比较，正在核对信息位置','已整理 2 项比较，正在核对冲突条件','已整理 3 项比较，正在检查出处与结论边界'];let step=resume?state.rows.length+1:0;const tick=()=>{if(token!==state.runToken||!state.busy)return;state.runStatus=steps[Math.min(step,4)];if(step>0&&state.rows.length<Math.min(step,3)){const def=rowDefs[state.rows.length];state.rows.push({...def,edited:false,revision:0,conflict:null});if(state.view==='result')renderContent()}updateChrome();if(step>=4){state.busy=false;state.runStatus='';state.history.push({who:'agent',text:'已将三份例文整理为比较初稿。保留了跨模型比较的缺口，没有把数量、相关性与位置合成一个原因。',result:true,steps:['查本研究：3 份示例 PDF','读页：A p.4、B p.7、C p.5','比较：3 项条件；没有额外来源','初稿自动留在研究工作面']});if(state.view==='result')renderContent();else updateChrome();if(state.reference==='history')renderReference();return}step++;setTimeout(tick,650)};tick();}
function stopRun(){state.busy=false;state.stopped=true;state.runToken++;state.history.push({who:'agent',text:'已停止。已完成的 '+state.rows.length+' 项比较保留在初稿中。'});updateChrome();if(state.reference==='history')renderReference()}
function send(){if(state.busy){stopRun();return}const text=$('agent-input').value.trim();if(!text)return;const target=state.focus?{...state.focus}:null;state.history.push({who:'user',text,target:target?.label||null});$('agent-input').value='';$('agent-input').style.height='';state.focus=null;state.shortAnswer=null;state.shortCollapsed=false;if(!state.rows.length){if(text.startsWith('比较这些论文')||text.startsWith('帮我比较')){runCompare();return}state.shortAnswer={text:'可以把研究理解为：先明确问题，再用来源支持或修正理解。你可以继续问一个小问题，也可以委托我比较本研究的资料；普通解释会留在这里，不会自动创建成果。'};state.history.push({who:'agent',text:state.shortAnswer.text});updateChrome();if(state.reference==='history')renderReference();return}const wantsRevision=['这里混淆了噪声比例和材料数量，请修订这一处。','再修订这一处。','重新比较这一处','把数量和相关性分开，修订这一处'].includes(text);if(wantsRevision){const id=target?.row||'r1',row=state.rows.find(r=>r.id===id)||state.rows[0];const after='应把材料数量与无关信息比例分别比较。在控制相关性、位置与实验设定之后，才能判断数量的独立影响；当前证据还不足以说明“更多材料必然更差”。';if(row.edited){row.conflict={before:row.text,after,stale:false};state.shortAnswer={text:'这处包含你的编辑。我已把建议放在原处，核对后可应用，也可以保留你的内容。',target:row.title};}else{state.lastChange={id:row.id,before:row.text,after,edited:row.edited};row.text=after;row.revision++;state.version++;state.shortAnswer={text:'已修订这处比较，保留了原文来源。你可以直接继续编辑，或撤销本次修改。',target:row.title};}state.view='result';selectRow(row.id);renderContent();state.history.push({who:'agent',text:state.shortAnswer.text,result:true});requestAnimationFrame(()=>document.querySelector('[data-row="'+row.id+'"]').scrollIntoView({block:'center'}));}else{const row=state.rows.find(r=>r.id===target?.row);state.shortAnswer={text:row?'这一处的关键是把变量分开：'+row.text+' 当前仍只依据对应例文，不能据此推广到所有模型。':'当前三份例文分别提示相关性、信息位置和来源冲突。可以先打开对应原文核查，再决定要补查哪一类条件。',target:target?.label||null};state.history.push({who:'agent',text:state.shortAnswer.text});updateChrome();}if(state.reference==='history')renderReference();}
function openReference(type,source){if(!state.reference&&state.view==='result')state.referenceOrigin={scroll:$('content').scrollTop,selection:state.selection,index:Math.max(1,state.rows.findIndex(r=>r.id===state.selection)+1)};state.reference=type;if(source)state.source=source;$('reference').classList.remove('hidden');renderReference();updateChrome();closeDrawer()}
function closeReference(){state.reference=null;$('reference').classList.add('hidden');updateChrome()}
function sourceCard(s,library){const has=state.documents.includes(s.id);return '<div class="ref-item" data-source-card="'+s.id+'"><h3>'+esc(s.title)+'</h3><p>'+esc(s.kind)+' · '+s.year+'</p><div class="line"><span>'+(has?'已在本研究':'尚未加入本研究')+'</span><span class="grow"></span>'+(library&&!has?'<button class="text-btn" data-action="adopt-source" data-source="'+s.id+'">收入本研究</button>':'<button class="text-btn" data-action="preview-source" data-source="'+s.id+'">查看</button>')+'</div></div>'}
function renderReference(){const type=state.reference,titles={citation:'原文出处',materials:'本研究资料',library:'资料库',history:'对话记录',scope:'研究范围',settings:'设置',find:'查找内容',project:'切换研究'};$('ref-title').textContent=titles[type]||'参考';let html='';if(type==='citation'){const s=sources.find(s=>s.id===state.source);html='<h2>'+esc(s.title)+'</h2><div class="ref-sub">'+esc(s.kind)+(s.page?' · 第 '+s.page+' 页':'')+'</div><div class="source-page"><div class="page-title">'+esc(s.topic)+'</div><p>'+esc(s.body.slice(0,45))+'</p><p><mark>'+esc(s.quote)+'</mark></p>'+(s.page?'<div class="page-no">'+s.page+'</div>':'')+'</div><p class="ref-note">合成研究样例，用于验证引用与阅读交互。不是已核实的文献结论。</p><div class="ref-actions">'+(s.page?'<button class="btn" data-action="deep-read">'+svg('doc')+'阅读全文</button>':'<span class="tag warn">尚无全文，无法定位原文</span>')+'</div>';}else if(type==='materials'){html='<h2>研究从这些资料开始</h2><p class="ref-sub">Agent 默认只在本研究范围内查找和读页。查看资料不会改变追问目标。</p>'+(state.documents.length?'<div class="ref-list">'+state.documents.map(id=>sourceCard(sources.find(s=>s.id===id),false)).join('')+'</div>':'<div class="no-data">还没有资料。此原型可一次加入三份合成 PDF 示例。</div><button class="btn primary" style="margin-top:16px;width:100%" data-action="add-examples">加入 3 份示例资料</button>')+'<button class="text-btn" style="margin-top:20px" data-action="library">从资料库添加 →</button>';}else if(type==='library'||type==='find'){html='<h2>'+(type==='find'?'找回已有内容':'你收下的资料')+'</h2><p class="ref-sub">可以直接浏览；采用只需一次动作。</p><input class="ref-search" id="library-query" aria-label="查找资料" placeholder="搜索标题或关键词" value="'+esc(state.search)+'"><div class="filter"><button class="'+(state.libraryFilter==='all'?'active':'')+'" data-action="filter" data-filter="all">全部</button><button class="'+(state.libraryFilter==='pdf'?'active':'')+'" data-action="filter" data-filter="pdf">PDF</button><button class="'+(state.libraryFilter==='notes'?'active':'')+'" data-action="filter" data-filter="notes">卡片与笔记</button></div><div class="ref-list" id="library-results">'+libraryResults()+'</div>';}else if(type==='history'){html='<h2>研究是怎样推进的</h2><p class="ref-sub">这里留短答与执行回执；比较正文始终留在工作面。</p>'+(state.history.length?state.history.map((h,i)=>'<div class="record"><div class="who">'+(h.who==='user'?'你':'Agent')+(h.target?' · '+esc(h.target):'')+'</div><p>'+esc(h.text)+'</p>'+(h.steps?'<details><summary class="small muted">查看已做的事</summary><ul class="steps">'+h.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul></details>':'')+(h.result?'<button class="result-link" data-action="result">'+svg('doc')+'回到比较初稿 →</button>':'')+'</div>').join(''):'<div class="no-data">还没有研究记录。只在下方输入一次，即可开始。</div>');}else if(type==='scope'){html='<h2>本轮可以取用什么</h2><p class="ref-sub">默认继续本研究。选区只是本轮焦点，不会自动扩大资料范围。</p><label class="scope-option"><input type="checkbox" checked disabled>本研究资料 · '+state.documents.length+' 份</label><label class="scope-option"><input type="checkbox" id="outside-scope">外部公开资料</label><p class="footnote">此原型不联网。外部范围只展示可见边界；不会发起实际检索，也不会把私有正文传给外部搜索。</p>';}else if(type==='settings'){html='<h2>保持研究工作面简单</h2><p class="ref-sub">运行设置按需查看，不占用每次研究的主路径。</p><div class="settings-row"><span>助手</span><strong>固定示例助手</strong></div><div class="settings-row"><span>数据</span><strong>仅当前页面内存</strong></div><div class="settings-row"><span>真实模型与工具</span><strong>未连接</strong></div><div class="settings-row"><span>运行</span><strong>可随时停止</strong></div><p class="footnote">这是交互设计演示，没有调用真实模型、读取用户资料、写入资料库或建立会话。</p>';}else if(type==='project'){html='<h2>研究空间</h2><p class="ref-sub">每个研究保存自己的资料与工作位置。</p><div class="ref-item"><h3>'+esc(state.title)+'</h3><p>当前示例研究</p></div><button class="btn" style="margin-top:16px;width:100%" data-action="new-research">＋ 新研究</button>';} $('ref-body').innerHTML=html;}
function libraryResults(){let list=sources.filter(s=>(state.libraryFilter==='all'||state.libraryFilter==='pdf'&&s.page)&&(!state.search||s.title.includes(state.search)||s.topic.includes(state.search)));let html=list.map(s=>sourceCard(s,true)).join('');if(state.libraryFilter==='notes'||state.libraryFilter==='all'){if(state.rows.length&&(!state.search||'检索材料与回答可靠性'.includes(state.search)))html+='<div class="ref-item"><h3>检索材料与回答可靠性</h3><p>研究笔记 · 比较初稿</p><button class="text-btn" data-action="result">打开原工作位置 →</button></div>';}if(state.libraryFilter==='notes'||state.libraryFilter==='all'){html+=legacyItems.filter(i=>!state.search||i.title.includes(state.search)||i.type.includes(state.search)||i.body.includes(state.search)).map(i=>'<div class="ref-item"><h3>'+esc(i.title)+'</h3><p>'+esc(i.type)+' · 已有工作 · 固定示例</p><button class="text-btn" data-action="open-legacy" data-id="'+i.id+'">打开 '+esc(i.type)+' →</button></div>').join('')}return html||'<div class="no-data">没有找到匹配内容。</div>'}
function deepRead(){const index=state.selection?state.rows.findIndex(r=>r.id===state.selection)+1:Math.max(1,state.rows.findIndex(r=>r.source===state.source)+1);state.returnPosition=state.referenceOrigin||{scroll:$('content').scrollTop,selection:state.selection,index};state.pdfSource=state.source;state.view='pdf';closeReference();renderContent();$('content').scrollTop=0;}
function returnResult(){state.view='result';closeReference();renderContent();if(state.returnPosition){state.selection=state.returnPosition.selection;selectRow(state.selection);$('content').style.scrollBehavior='auto';$('content').scrollTop=state.returnPosition.scroll;$('content').style.scrollBehavior='';}updateChrome();}
function resetResearch(){state.runToken++;Object.assign(state,{title:'新研究',view:'welcome',documents:[],rows:[],busy:false,stopped:false,progress:0,focus:null,selection:null,reference:null,history:[],shortAnswer:null,shortCollapsed:false,lastChange:null,version:1,returnPosition:null,canvasNotes:[]});$('agent-input').value='';closeReference();closeDrawer();renderContent();notify('已打开空研究；此设计原型不会保存或删除真实资料。')}
function applyChange(id){const row=state.rows.find(r=>r.id===id),c=row.conflict;if(row.text!==c.before){c.before=row.text;c.stale=true;renderContent();notify('正文有新修改，请核对更新后的差异。');return}state.lastChange={id,before:row.text,after:c.after,edited:row.edited};row.text=c.after;row.conflict=null;row.revision++;state.version++;renderContent();notify('已应用这处建议，可撤销。')}
function undo(){const c=state.lastChange;if(!c)return;const row=state.rows.find(r=>r.id===c.id);if(row.text!==c.after){notify('这处在应用后又被你修改过，已保留你的内容，未覆盖。');return}row.text=c.before;row.edited=c.edited;row.revision++;state.lastChange=null;state.version++;renderContent();notify('已撤销 Agent 修改，你之前的编辑保留。')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b){const row=e.target.closest('[data-row]');if(row)selectRow(row.dataset.row);return;}const a=b.dataset.action;if(a==='drawer'){$('sidebar').classList.toggle('open');$('drawer-shade').classList.toggle('open');syncDrawer()}if(a==='project')openReference('project');if(a==='new-research')resetResearch();if(['materials','library','history','settings','scope','find'].includes(a))openReference(a);if(a==='close-reference')closeReference();if(a==='example'){$('agent-input').value='比较这些论文：材料变多时，回答在什么条件下反而更不可靠？';$('agent-input').focus()}if(a==='add-examples'){state.documents=['a','b','c'];renderReference();updateChrome();notify('3 份合成示例资料已加入当前示例研究。')}if(a==='continue')runCompare(true);if(a==='citation'){selectRow(b.dataset.rowid);openReference('citation',b.dataset.source)}if(a==='preview-source')openReference('citation',b.dataset.source);if(a==='ask-row'){const row=state.rows.find(r=>r.id===b.dataset.rowid);if(row){selectRow(row.id);setFocus({row:row.id,label:'本次追问 · 第'+(state.rows.indexOf(row)+1)+'项：'+row.title})}}if(a==='clear-focus')setFocus(null);if(a==='deep-read')deepRead();if(a==='return-result')returnResult();if(a==='ask-source'){const row=state.rows.find(r=>r.source===state.pdfSource);setFocus({row:row?.id,label:'本次追问 · '+sources.find(s=>s.id===state.pdfSource).title+' p.'+sources.find(s=>s.id===state.pdfSource).page})}if(a==='welcome'){state.view='welcome';renderContent();closeReference()}if(a==='open-legacy'){state.legacyId=b.dataset.id;state.view='legacy';closeReference();renderContent();$('content').scrollTop=0}if(a==='result'){if(state.rows.length){state.view='result';renderContent();closeDrawer()}}if(a==='canvas'){state.view='canvas';renderContent();$('content').scrollTop=0;closeDrawer()}if(a==='canvas-ask')setFocus({row:'r1',label:'本次追问 · 卡片：材料更多，回答就会更可靠吗？'});if(a==='canvas-tool'){state.drawingTool=b.dataset.tool;renderCanvas();notify({select:'已选择移动工具。',text:'文字工具：点击画布空白处留下示例文字。',shape:'形状工具：点击画布空白处添加示例形状。',pen:'画笔工具：点击画布空白处留下示例笔迹。',connect:'连线工具：本原型仅展示已有来源关系，未实现自由连线。'}[state.drawingTool])}if(a==='canvas-add'){state.canvasNotes.push('新卡片 · 待写下你的理解');renderCanvas();notify('卡片已和论文、图形放在同一画布。')}if(a==='adopt-source'){if(!state.documents.includes(b.dataset.source))state.documents.push(b.dataset.source);renderReference();updateChrome();notify('已收入本研究，无需重复加入讨论或摆放。')}if(a==='filter'){state.libraryFilter=b.dataset.filter;renderReference()}if(a==='apply-change')applyChange(b.dataset.rowid);if(a==='keep-edit'){const row=state.rows.find(r=>r.id===b.dataset.rowid);row.conflict=null;renderContent();notify('保留了你的正文。')}if(a==='undo')undo();if(a==='export'){const body='# 材料更多，回答就会更可靠吗？\n\n设计原型 · 固定合成示例，非真实文献研究\n\n'+state.rows.map((r,i)=>'## '+(i+1)+'. '+r.title+'\n\n'+r.text+'\n\n来源：'+sources.find(s=>s.id===r.source).title+' p.'+sources.find(s=>s.id===r.source).page).join('\n\n');const url=URL.createObjectURL(new Blob([body],{type:'text/markdown;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='研究初稿-设计示例.md';link.click();setTimeout(()=>URL.revokeObjectURL(url),500);notify('已导出带示例来源说明的 Markdown。')}});
$('agent-form').addEventListener('submit',e=>{e.preventDefault();send()});$('agent-input').addEventListener('input',()=>{const input=$('agent-input');input.style.height='auto';input.style.height=Math.min(140,Math.max(state.view==='welcome'?50:40,input.scrollHeight))+'px';if(input.scrollHeight>85&&state.shortAnswer){state.shortCollapsed=true;const details=document.querySelector('#short-answer details');if(details)details.open=false}});$('agent-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-edit]')){const row=state.rows.find(r=>r.id===e.target.dataset.edit);row.text=e.target.textContent;row.edited=true;row.revision++;const article=e.target.closest('article');article.querySelector('.edit-hint').textContent='你已编辑 · 原文引用'}if(e.target.id==='library-query'){state.search=e.target.value;$('library-results').innerHTML=libraryResults()}});
document.addEventListener('toggle',e=>{if(e.target.classList?.contains('short-answer'))state.shortCollapsed=!e.target.open},true);
document.addEventListener('focusout',e=>{if(e.target.id==='current-title'){state.title=e.target.textContent.trim()||'新研究';$('project-title').textContent=state.title;e.target.textContent=state.title}});
document.addEventListener('mouseup',()=>{const selection=getSelection();if(!selection||selection.isCollapsed)return;const node=selection.anchorNode?.parentElement?.closest('[data-row]');if(node)selectRow(node.dataset.row)});
document.addEventListener('click',e=>{if((e.target.id==='canvas'||e.target.classList.contains('canvas-scene'))&&state.drawingTool!=='select'){state.canvasNotes.push({text:'待核查：这里的新问题',shape:'形状 · 待核查条件',pen:'手绘笔迹 · 示例',connect:'手绘关系 · 待确认'}[state.drawingTool]);renderCanvas()}});
document.addEventListener('keydown',e=>{if(e.target.id==='current-title'&&e.key==='Enter'){e.preventDefault();e.target.blur()}if(e.key==='Escape'){closeReference();closeDrawer()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openReference('find');$('library-query').focus()}if(e.altKey&&e.key==='ArrowLeft'&&state.view==='pdf'){e.preventDefault();returnResult()}});
$('drawer-shade').addEventListener('click',closeDrawer);window.addEventListener('resize',syncDrawer);syncDrawer();renderContent();
</script>
