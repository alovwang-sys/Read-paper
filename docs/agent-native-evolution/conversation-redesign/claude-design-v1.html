<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Papertrail · 交互原型</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font:14px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#1f2328;background:#fff}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #d7dade;background:#fff;border-radius:6px;padding:2px 10px}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2f9e6b;outline-offset:1px}
#G{display:grid;grid-template-columns:240px 1fr 360px;height:100vh}#G.nr{grid-template-columns:240px 1fr}
#L{background:#f3f4f6;border-right:1px solid #e4e6e9;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
#L select,#L input{width:100%;border:1px solid #d7dade;border-radius:6px;padding:4px 8px;background:#fff}
.row{display:flex;align-items:center;gap:6px;height:36px;width:100%;border:0;background:none;padding:0 8px;text-align:left;flex:none}.row span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row.on{background:#fff;box-shadow:0 0 0 1px #e1e3e6}.row.un span{font-weight:600}
.dot,.sp{width:7px;height:7px;border-radius:50%;background:#2f9e6b;flex:none}.sp{background:#9aa0a6;animation:p 1s infinite}@keyframes p{50%{opacity:.2}}
.sec{border:0;background:none;padding:6px 8px;text-align:left;font-weight:600;color:#555}.rl{display:flex;flex-direction:column}
#M{display:flex;flex-direction:column;min-width:0}
#hd{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 110px 0 16px;border-bottom:1px solid #eceef0}#hd h1{font-size:15px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tg{display:none}.mut{color:#6b7280;font-size:12px}
#V{flex:1;overflow:auto}.w{max-width:740px;margin:0 auto;padding:16px 24px}
.u{background:#f1f3f4;border-radius:10px;padding:8px 12px;margin:16px 0 16px auto;width:fit-content;max-width:85%}
.a{margin:16px 0}.a .n{font-size:13px;color:#6b7280}.a p,.a ul{margin:4px 0}
.cite{border:0;background:#e7f4ec;color:#17734a;padding:0 6px}.err{color:#b42318}
.chip{display:inline-flex;align-items:center;font-size:12px;background:#e7f4ec;color:#17734a;border-radius:10px;padding:0 4px 0 8px;margin:0 4px 4px 0}.chip button{border:0;background:none;padding:0 4px}
#C{flex:none;padding:0 24px 16px}.bx{max-width:740px;margin:0 auto;border:1px solid #d7dade;border-radius:10px;padding:8px 10px}
#ta{width:100%;border:0;resize:none;outline:none;height:52px}.bar{display:flex;align-items:center;gap:8px}.go{margin-left:auto;background:#2f9e6b!important;color:#fff;border-color:#2f9e6b!important}
#mw{position:relative}#menu{position:absolute;bottom:110%;left:0;background:#fff;border:1px solid #d7dade;border-radius:8px;box-shadow:0 6px 20px #0002;padding:4px;width:240px;z-index:9}
.mi{display:flex;align-items:center;gap:6px;width:100%;border:0;padding:6px 8px;text-align:left;background:none}.mi:hover{background:#f3f4f6}.mi .mut,.mi>button{margin-left:auto}
#R{border-left:1px solid #e4e6e9;display:flex;flex-direction:column;background:#fafafa;min-width:0;padding-top:18px}
.rh{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid #eceef0}.rh b{flex:1;font-size:13px}
.pg{background:#fff;border:1px solid #e4e6e9;padding:20px;margin:12px;border-radius:4px;font-size:13px;line-height:1.8}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:16px 24px}.card{border:1px solid #e4e6e9;border-radius:8px;padding:12px;background:#fff}
#doc{width:100%;height:calc(100vh - 260px);border:1px solid #e4e6e9;border-radius:8px;padding:16px;line-height:1.8}
#tag{position:fixed;top:4px;right:8px;font-size:11px;color:#9aa0a6;z-index:20}
@media(max-width:1100px){#G,#G.nr{grid-template-columns:1fr}#L{position:fixed;inset:0 auto 0 0;width:260px;z-index:10;transform:translateX(-102%);transition:.15s;box-shadow:4px 0 20px #0002}#L.on{transform:none}.tg{display:inline-block}
#R{position:fixed;top:48px;right:0;bottom:0;width:360px;z-index:8;padding-top:0;box-shadow:-4px 0 20px #0002}body.ro #M{margin-right:360px}}
</style></head><body>
<div id=tag>交互原型·示例</div>
<div id=G class=nr>
<nav id=L aria-label="侧栏">
<select id=rs aria-label="切换研究"><option value=0>检索策略比较研究</option><option value=1>综述写作准备</option></select>
<button data-act=new>＋ 新会话</button>
<input id=q type=search placeholder="搜索会话" aria-label="搜索会话">
<div id=rows class=rl></div>
<button class=sec data-act=lib aria-expanded=false>资料与成果 ▸</button>
<div id=lib class=rl hidden></div>
</nav>
<main id=M><div id=hd></div><div id=V></div>
<div id=C><div class=bx><div id=to></div><div id=chips></div><textarea id=ta aria-label="输入消息" placeholder="输入问题…"></textarea>
<div class=bar><div id=mw><button id=ab data-act=menu aria-haspopup=menu aria-expanded=false aria-label="选择助手"></button><div id=menu role=menu hidden></div></div><span class=mut id=hint></span><button class=go id=sb data-act=send aria-label="发送">发送</button></div></div></div></main>
<aside id=R hidden aria-label="原文参考"></aside></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),cl=n=>Math.max(1,Math.min(20,n));
let nid=3,oc=0,opener=null,doc='研究笔记（样例）\n\n一、检索式A与B在未限定年份时召回接近。\n二、待补：限定年份后的对照。';
const st={cur:1,view:'chat',ref:0,page:12,ret:null,rs:'0'};
const board=[{x:'检索式B对同义词扩展更敏感（样例）'},{x:'限定2018年后样本量减少约三成（样例）'},{x:'样例论文A表3可作为主要对照'}];
const A=(x,a)=>({r:'a',a,st:'ok',x});
const S=[
{id:1,rs:'0',t:'比较检索条件',a:'Claude Code',m:[{r:'u',x:'比较检索式A和B在近五年文献中的召回差异'},A('初步看B召回更高，需要核对限定年份后的结果。','Codex')],d:'限定2018年后再比较一次',g:['检索式B']},
{id:2,rs:'0',t:'补查证据',a:'Claude Code',m:[{r:'u',x:'样例论文A里有没有支持B的数据？'},A('第4页方法部分描述了检索式构造，数据表在后文。','Claude Code')],d:'',g:['样例论文A·第4页']},
{id:3,rs:'0',t:'旧 Codex 原生记录',a:'Codex',nat:1,m:[{r:'u',x:'整理一张检索式对照表'},A('已列出A/B在三个数据库中的命中数（样例）。','Codex')],d:'对照表里补上去重后的数量',g:['对照表草稿']}];
const cur=()=>S.find(s=>s.id==st.cur),ta=$('#ta');
const pg=n=>n==12?'表3（样例数据）：限定2018年后，检索式B召回0.81，检索式A召回0.66。作者指出差异主要来自同义词扩展。':n==4?'方法（样例）：检索式A为标题关键词组合；检索式B加入同义词与主题词扩展。':`样例论文A第${n}页的示例正文，合成文本，仅用于演示阅读与引用。`;
const ANS=`<p><b>结论</b>：限定2018年后，检索式B召回仍高于A（0.81 对 0.66）。</p><ul><li>差异主要来自同义词扩展。</li><li>样本量下降，建议在另一数据库补查。</li></ul><p>依据 <button class=cite data-act=cite data-p=12>[样例论文A·PDF第12页]</button></p>`;
const RES={pdf:'样例论文A',card:'文献卡片',board:'白板',doc:'研究笔记'};
function rows(){const q=$('#q').value.trim(),L=S.filter(s=>s.rs==st.rs&&s.t.includes(q));
$('#rows').innerHTML=L.length?L.map(s=>`<button class="row${s.id==st.cur&&st.view=='chat'?' on':''}${s.un?' un':''}" data-act=go data-id=${s.id} aria-label="${E(s.t)}${s.un?'，有新回复':''}${s.run?'，处理中':''}"${s.id==st.cur?' aria-current=true':''}><span>${E(s.t)}</span>${s.run?'<i class=sp></i>':s.un?'<i class=dot></i>':''}</button>`).join(''):'<div class=mut style="padding:6px 8px">暂无会话</div>';
$('#lib').innerHTML=Object.entries(RES).map(([k,v])=>`<button class="row${st.view==k?' on':''}" data-act=open data-v=${k}><span>${v}</span></button>`).join('')}
function msg(m,i){if(m.r=='u')return`<div class=u>${E(m.x)}${m.g&&m.g.length?'<div>'+m.g.map(t=>`<span class=chip>${E(t)}</span>`).join('')+'</div>':''}</div>`;
return`<div class=a id=m${i}><div class=n>${E(m.a)}</div>${m.st=='run'?'<p class=mut>处理中…</p>':m.st=='fail'?`<p class=err>这一轮没有完成（模拟失败）。 <button data-act=retry data-i=${i}>重试</button></p>`:m.h?m.h+`<button data-act=keep data-i=${i}${m.k?' disabled':''}>${m.k?'已收录到白板':'收录'}</button>`:`<p>${E(m.x)}</p>`}</div>`}
function res(v){if(v=='pdf')return`<div class=w><div class=bar><button data-act=pg data-d=-1 aria-label="上一页">‹</button><span>第 ${st.page} / 20 页</span><button data-act=pg data-d=1 aria-label="下一页">›</button><button data-act=add data-t="样例论文A·第${st.page}页">加入提问（本页）</button></div><div class=pg>${pg(st.page)}</div></div>`;
if(v=='board')return`<div class=cards>${board.map((b,i)=>`<div class=card><p>${E(b.x)}</p><button data-act=add data-t="白板卡片${i+1}">加入提问</button></div>`).join('')}</div>`;
if(v=='doc')return`<div class=w style="max-width:none"><div class=bar style="margin-bottom:8px"><span class=mut>自动保存</span><button data-act=add data-t="研究笔记（文稿）">加入提问</button></div><textarea id=doc aria-label="文稿正文">${E(doc)}</textarea></div>`;
return`<div class=w><div class=card><b>样例论文A</b><p class=mut>样例 · 作者甲、作者乙 · 2021 · 自制样例，无DOI</p><p>研究检索式扩展对召回的影响。</p><button data-act=cite data-p=1>打开PDF</button></div></div>`}
function main(){const s=cur(),v=st.view;let h='<button class=tg data-act=nav aria-label="展开侧栏">☰</button>';
if(v=='chat'){const r=st.ret&&st.ret.sid==s.id?st.ret.v:0;if(r)h+=`<button data-act=open data-v=${r}>← 回到${RES[r]}</button>`;h+=`<h1>${E(s.t)}</h1>`;
$('#V').innerHTML=`<div class=w>${s.m.map(msg).join('')||'<p class=mut>开始提问。</p>'}</div>`}
else{h+=`<h1>${RES[v]}</h1><span class=mut>提问发往</span><button data-act=chat>${E(s.t)} →</button>`;$('#V').innerHTML=res(v)}
$('#hd').innerHTML=h;$('#to').innerHTML=v=='chat'?'':`<div class=mut>发送后回到「${E(s.t)}」聊天${v=='pdf'?'，原文在右侧保持同页':''}</div>`;chips();bar()}
function chips(){$('#chips').innerHTML=cur().g.map((t,i)=>`<span class=chip>${E(t)}<button data-act=rm data-i=${i} aria-label="移除${E(t)}">×</button></span>`).join('')}
function bar(){const s=cur();$('#ab').textContent=s.a+' ▾';$('#ab').disabled=!!s.run;$('#hint').textContent=s.run?'处理中':'';$('#sb').disabled=!!s.run||!ta.value.trim()}
function ref(){const R=$('#R');document.body.classList.toggle('ro',!!st.ref);$('#G').classList.toggle('nr',!st.ref);R.hidden=!st.ref;if(!st.ref)return;
R.innerHTML=`<div class=rh><b>样例论文A · 第${st.ref}页</b><button data-act=full>全文阅读</button><button data-act=add data-t="样例论文A·第${st.ref}页">加入提问</button><button data-act=x aria-label="关闭原文">×</button></div><div style="overflow:auto"><div class=pg>${pg(st.ref)}</div><div class=bar style="padding:0 12px"><button data-act=rp data-d=-1 aria-label="上一页">‹</button><button data-act=rp data-d=1 aria-label="下一页">›</button></div></div>`}
function render(){rows();main();ref()}
function closeNav(f){const L=$('#L');if(L.classList.contains('on')){L.classList.remove('on');f&&$('.tg')&&$('.tg').focus()}}
function menuH(){const s=cur();return['Codex','Claude Code','OpenCode'].map(n=>n=='OpenCode'&&!oc?`<div class=mi>OpenCode <span class=mut>未连接</span><button data-act=conn aria-label="连接OpenCode（模拟）">连接</button></div>`:s.nat&&n!=s.a?`<button class=mi role=menuitem data-act=fork data-n="${n}">${n}<span class=mut>新会话</span></button>`:`<button class=mi role=menuitemradio aria-checked=${n==s.a} data-act=pick data-n="${n}">${n}${n==s.a?' ✓':''}</button>`).join('')}
function openMenu(o){const m=$('#menu');m.hidden=!o;$('#ab').setAttribute('aria-expanded',o);if(o){m.innerHTML=menuH();const f=m.querySelector('button');f&&f.focus()}}
function run(s,m){s.run=1;m.st='run';setTimeout(()=>{s.run=0;if(m.f){m.f=0;m.st='fail'}else{m.st='ok';m.h=ANS}if(st.cur!=s.id)s.un=1;
if(st.cur==s.id&&st.view=='chat'){render();const e=document.getElementById('m'+s.m.indexOf(m));e&&e.scrollIntoView({block:'nearest'})}else{rows();bar()}},2000)}
const act={
go(b){st.cur=+b.dataset.id;st.view='chat';const s=cur(),u=s.un;s.un=0;ta.value=s.d;openMenu(0);closeNav();render();const as=document.querySelectorAll('#V .a');u&&as.length?as[as.length-1].scrollIntoView({block:'start'}):($('#V').scrollTop=1e6)},
new(){const s={id:++nid,rs:st.rs,t:'新会话',a:'Claude Code',m:[],d:'',g:[]};S.unshift(s);act.go({dataset:{id:s.id}});ta.focus()},
lib(b){const l=$('#lib'),o=l.hidden;l.hidden=!o;b.setAttribute('aria-expanded',o);b.textContent='资料与成果 '+(o?'▾':'▸')},
open(b){st.view=b.dataset.v;if(st.view=='pdf'&&st.ref){st.page=st.ref;st.ref=0}closeNav();render();$('#V').scrollTop=0},
chat(){st.view='chat';render();$('#V').scrollTop=1e6},
cite(b){opener=b;st.ref=+b.dataset.p;closeNav();ref();$('#R [data-act=x]').focus()},
full(){st.page=st.ref;st.ref=0;st.view='pdf';render()},
x(){st.ref=0;ref();(opener&&document.contains(opener)?opener:ta).focus()},
rp(b){st.ref=cl(st.ref+ +b.dataset.d);ref()},
pg(b){st.page=cl(st.page+ +b.dataset.d);main()},
add(b){const g=cur().g,t=b.dataset.t;if(!g.includes(t))g.push(t);chips();b.textContent='已加入'},
rm(b){cur().g.splice(+b.dataset.i,1);chips();ta.focus()},
menu(){openMenu($('#menu').hidden)},
pick(b){cur().a=b.dataset.n;openMenu(0);bar();$('#ab').focus()},
conn(){oc=1;openMenu(1)},
fork(b){const s=cur(),n={id:++nid,rs:s.rs,t:s.t+' · '+b.dataset.n,a:b.dataset.n,m:[],d:ta.value,g:[...s.g]};S.splice(S.indexOf(s)+1,0,n);act.go({dataset:{id:n.id}});ta.focus()},
send(){const s=cur(),x=ta.value.trim();if(!x||s.run)return;s.m.push({r:'u',x,g:s.g});s.g=[];s.d='';ta.value='';
if(st.view!='chat'){st.ret={v:st.view,sid:s.id};if(st.view=='pdf')st.ref=st.page;st.view='chat'}
const m={r:'a',a:s.a,f:/模拟失败/.test(x)};s.m.push(m);run(s,m);render();$('#V').scrollTop=1e6},
retry(b){const s=cur();run(s,s.m[+b.dataset.i]);render()},
keep(b){const s=cur();s.m[+b.dataset.i].k=1;board.push({x:`限定2018年后B召回0.81，高于A的0.66（收录自「${s.t}」）`});main()},
nav(){const L=$('#L'),o=!L.classList.contains('on');L.classList.toggle('on',o);if(o){st.ref=0;ref();$('#rs').focus()}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!$('#menu').hidden&&!e.target.closest('#mw'))openMenu(0);
if($('#L').classList.contains('on')&&!e.target.closest('#L')&&!(b&&b.dataset.act=='nav'))closeNav();if(b&&!b.disabled&&act[b.dataset.act])act[b.dataset.act](b)});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){if(!$('#menu').hidden){openMenu(0);$('#ab').focus()}else if(st.ref)act.x();else closeNav(1)}
if(e.key=='Enter'&&!e.shiftKey&&e.target==ta&&!e.isComposing){e.preventDefault();act.send()}});
document.addEventListener('input',e=>{if(e.target.id=='doc')doc=e.target.value});
ta.oninput=()=>{cur().d=ta.value;bar()};$('#q').oninput=rows;
$('#rs').onchange=e=>{st.rs=e.target.value;const f=S.find(s=>s.rs==st.rs);f?act.go({dataset:{id:f.id}}):rows()};
ta.value=cur().d;render();
</script></body></html>
