<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Papertrail · 对话工作台设计</title><link rel="stylesheet" href="prototype.css"></head><body>
<div id=tag>交互原型·示例</div>
<div id=G class=nr>
<nav id=L aria-label="侧栏">
<div class="brand"><span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15"/></svg></span><span class="brand-name">Papertrail</span></div>
<div class="research-switch"><button id="rs" data-act="research" aria-haspopup="dialog" aria-expanded="false" aria-label="切换研究"><span id="research-name">检索策略比较研究</span><span aria-hidden="true">⌄</span></button><div id="research-menu" role="dialog" aria-label="研究列表" hidden><button data-act="study" data-id="0">检索策略比较研究</button><button data-act="study" data-id="1">综述写作准备</button></div></div>
<button class="new-chat" data-act=new><span aria-hidden="true">＋</span> 新会话</button>
<label class="search-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id=q type=search placeholder="搜索会话" aria-label="搜索会话"></label><div class="nav-caption">会话</div>
<div id=rows class=rl></div>
<div class="sidebar-bottom"><button class=sec data-act=lib aria-expanded=false>资料与成果 ▸</button>
<div id=lib class=rl hidden></div><button class="library-entry" data-act="library">资料库</button></div>
</nav>
<main id=M><div id=hd></div><div id=V></div><button id="latest" data-act="latest" hidden>↓ 查看新回复</button>
<div id=C><div class=bx><div id=to></div><div id=chips></div><textarea id=ta aria-label="输入消息" placeholder="输入问题…"></textarea>
<div class=bar><div id=mw><button id=ab data-act=menu aria-haspopup=dialog aria-expanded=false aria-label="选择助手"></button><div id=menu role=dialog aria-label="选择助手" hidden></div></div><div class="input-extra"><button type="button" class="icon-btn" data-act="image" aria-label="添加图片示例" title="添加图片示例"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/></svg></button><button type="button" class="icon-btn" data-act="voice" aria-label="语音输入说明" title="语音输入"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button></div><span class=mut id=hint role="status"></span><button class=go id=sb data-act=send aria-label="发送">发送</button></div></div></div></main>
<aside id=R hidden aria-label="原文参考"></aside></div><div id="notice" class="prototype-notice" role="status" hidden></div>
<script src="prototype.js"></script></body></html>
