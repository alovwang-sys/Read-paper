<script>
(() => {
  'use strict';

      $('#workspace').innerHTML=header+`<div class="cards-view"><div class="eyebrow muted">YOUR RESEARCH, REMEMBERED</div><h1>让每一个理解，都有出处。</h1><p class="small muted">${state.cards.length?`当前研究有 ${state.cards.length} 张卡片。点击可查看正文、论文依据和相关对话。`:'对话中值得留下的知识点，将汇集在这里。'}</p>${state.cards.length?`<div class="cards-grid">${state.cards.map(c=>`<button class="knowledge-card" data-action="open-card" data-id="${c.id}"><span class="pill">${icon('cards')} 知识卡片</span><h3>${esc(c.title)}</h3><p>${esc(c.body.slice(0,110))}…</p><div class="row between"><span class="small muted">${c.paper?'论文 + 对话来源':'仅对话来源'}</span><span class="small" style="color:#527440">查看 →</span></div></button>`).join('')}</div>`:`<div class="empty-cards"><h3>从一个问题开始。</h3><p class="small">选取原文，与 AI 讨论，再将一个知识点整理成卡片。</p><button class="secondary" data-action="view-paper" style="margin-top:18px">${icon('book')} 返回论文阅读</button></div>`}</div><div class="workspace-foot"><span>交互原型 · 卡片仅保留在本次页面中</span><span>${state.cards.length} 张卡片</span></div>`;return;

An answer may appear plausible while leaving an important assumption unsupported by the available sources.</p><div class="diagram ${state.mode==='region'?'region-active':''}" id="diagram" aria-label="区域框选示意图"><div class="diagram-label">FIGURE 2 / A SIMPLE EVIDENCE PATH</div><div class="diagram-flow"><div class="diagram-node">Research<br>question</div><span class="muted">→</span><div class="diagram-node">Relevant<br>evidence</div><span class="muted">→</span><div class="diagram-node">Bounded<br>conclusion</div></div><div class="diagram-foot">Relevance and coverage shape the conclusion.</div><div class="region-box" id="region-box"></div></div><h2>3.1 Reading the limitations</h2><p>The distinction between a supported statement and an interpretation matters. Readers should retain the original excerpt, its page location, and the explanation used to form a note.</p><div class="sample-note">本页为项目自制研究材料，用于讨论交互。段落、图示和 AI 回答均为样例，不代表真实论文结论。可拖选英文文字，也可使用上方“选取示例段落”。</div><div class="paper-footer"><span>Evidence, interpretation, and traceability</span><span>3</span></div></article></div><div class="workspace-foot"><span>adaptive-retrieval.pdf <span class="wide">· 原型用 HTML 示意阅读页</span></span><span>PDF 第 3 页</span></div>`;
    if(state.selection?.type==='region')showRegionBox(8,8,$('#diagram').clientWidth-16,$('#diagram').clientHeight-16);

  }
  function completed(s=session()){return s.turns.filter(t=>t.status==='complete'&&!t.superseded);}
  function selectedHistory(s=session()){return s.history==='none'?[]:s.history==='latest'?completed(s).slice(-1):completed(s);}
  function render(){
    openPanel();const p=$('#panel');
    if(state.view==='chat')p.innerHTML=chatView();
    else if(state.view==='draft')p.innerHTML=draftView();
    else if(state.view==='card')p.innerHTML=cardView();
    else if(state.view==='source')p.innerHTML=sourceView();
    else p.innerHTML=historyView();
    if(state.view==='chat'){const scroll=$('#chat-scroll');scroll.scrollTop=session().scroll||scroll.scrollHeight;}
    updateCounts();
  }
  function chatView(){const s=session();return `<div class="panel-subhead"><h3>${esc(s.title)}</h3>${state.draft?`<button class="plain" data-action="resume-draft" style="font-size:11px">继续草稿 ↗</button>`:`<span class="pill" style="font-size:11px">${s.turns.length?selectedHistory(s).length+' 轮完成':'新会话'}</span>`}</div><div class="demo-note">${icon('spark')} 预设回答演示 · 未连接真实模型</div>${state.restored?'<div class="alert" style="margin:12px 16px 0">模拟恢复：输入与草稿已保留。实际刷新原型会重置。</div>':''}<div class="chat-scroll" id="chat-scroll" tabindex="0" aria-label="会话消息">${s.turns.length?s.turns.map(turnView).join(''):`<div class="welcome"><div class="welcome-mark">${icon('spark')}</div><div class="eyebrow" style="color:#78916c;margin-bottom:10px">READ WITH A QUESTION</div><h3>从一段原文，<br>走向自己的理解。</h3><p>选择左侧的文字，带着证据提问。<br>值得留下的理解，可以整理成卡片。</p><div class="quick"><button data-action="quick" data-prompt="这段话的核心观点是什么？">这段话的核心观点是什么？ <span style="float:right">↗</span></button><button data-action="quick" data-prompt="请说明证据相关性与覆盖率的区别。">哪些条件值得进一步核查？ <span style="float:right">↗</span></button></div><p style="font-size:11px;margin-top:22px;color:#95a08c">1 选材料　→　2 讨论　→　3 留下知识</p></div>`}</div><div class="composer"><div class="context-heading"><span>本轮材料 · ${s.context?1:0} 条</span>${s.context?'<button class="view-link" data-action="preview-context" style="font-size:11px">查看摘录</button>':''}</div>${s.context?`<div class="context-chip">${icon(s.context.type==='region'?'frame':'file')}<span class="grow">Adaptive Retrieval · PDF 第 3 页${s.context.type==='region'?' · 区域':''}</span><button class="icon" data-action="clear-context" aria-label="移除本轮材料">${icon('close')}</button></div>`:'<div class="context-empty">可先选择原文；无论文证据时，回答仅有对话来源。</div>'}<div class="history-scope"><span>前序对话 · ${selectedHistory(s).length} 轮</span><select id="history-range" aria-label="本轮前序对话范围"><option value="all" ${s.history==='all'?'selected':''}>本会话全部完成问答</option><option value="latest" ${s.history==='latest'?'selected':''}>仅最近一轮完成问答</option><option value="none" ${s.history==='none'?'selected':''}>不包含前序问答</option></select></div><div class="input-wrap"><textarea id="prompt" aria-label="向 AI 提问" placeholder="带着问题，继续理解这段材料…">${esc(s.input)}</textarea><div class="input-bottom"><span>模拟文本模型 · ⌘ / Ctrl ↵</span><button class="primary send" data-action="${state.running&&state.running.sessionId===s.id?'stop':'send'}" aria-label="${state.running&&state.running.sessionId===s.id?'停止生成':'发送问题'}" ${!state.running&&!s.input.trim()?'disabled':''}>${state.running&&state.running.sessionId===s.id?'■':icon('arrow')}</button></div></div><p class="scope-note">${s.turns.length?'前序消息可能含旧材料。移除本轮材料不会改写历史；可新建不含历史的对话。':'仅使用选定材料与前序问答；不会自动发送整篇论文。'}</p></div>`;}
  function turnView(t){return `<article class="message" data-turn="${t.id}"><div class="question">${esc(t.question)}</div><div class="turn-meta">本轮 ${t.context?1:0} 条材料 · ${t.historyCount} 轮历史 · ${t.time}${t.superseded?' · 保留的旧版':''}</div><div class="assistant-label">${icon('spark')} Papertrail <span class="muted" style="font-weight:400">/ 模拟回答</span></div><div class="assistant-body" data-answer="${t.id}">${t.paragraphs.slice(0,t.shown).map((v,i)=>`<p data-paragraph="${i}">${esc(v)}${t.context&&i===1?` <button class="citation" data-action="turn-source" data-id="${t.id}" aria-label="查看 PDF 第 3 页引用">[1]</button>`:''}</p>`).join('')}${t.status==='generating'?'<p class="muted" role="status">正在生成模拟回答<span aria-hidden="true">…</span></p>':''}</div>${t.status==='complete'?`<div class="message-actions"><button class="plain" data-action="copy" data-id="${t.id}">复制</button>${t===session().turns.at(-1)?`<button class="plain" data-action="regenerate" data-id="${t.id}">重新生成</button>`:''}<button class="plain" data-action="fragment" data-id="${t.id}">选片段</button><button class="secondary" data-action="draft" data-id="${t.id}">${icon('cards')} 整理为卡片</button></div>${t.context?'<div class="small muted" style="font-size:11px;margin-top:8px">引用可定位 · 观点仍需核查</div>':'<span class="pill warm" style="margin-top:11px">仅对话来源 · 待核查</span>'}`:t.status==='generating'?'':`<div class="alert ${t.status==='error'?'error':''}"><strong>回答未完成</strong> · ${t.status==='error'?'模拟连接中断':'已停止'}，已保留部分内容；不会进入后续默认历史。<br><button class="view-link" data-action="retry" data-id="${t.id}" style="margin-top:8px">按原范围重试</button></div>`}</article>`;}
  function start(question, retry=null, previous=null){
    const s=session();if(state.running){toast('已有模拟回答正在生成，请先停止或等待完成。');return;}question=(question??s.input).trim();if(!question){$('#prompt')?.focus();return;}
    if(!s.turns.length)s.title=question.length>16?question.slice(0,16)+'…':question;
    const t={id:++state.counter,question,context:retry?retry.context:(s.context?{...s.context}:null),historyCount:retry?retry.historyCount:selectedHistory(s).filter(x=>x!==previous).length,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),status:'generating',shown:0,paragraphs:completed(s).length?[ '可以把两者分开核查：相关性回答“这份材料是否与问题有关”，覆盖率回答“重要条件是否都有材料支持”。', '比如，一段证据讨论准确性，却没有说明数据范围。它可能是相关的，但仍不足以支持“所有场景都有效”的结论。', '整理卡片时，可以把观点写成有条件的表述，并注明还需要核查哪些条件。以上是模拟解释。' ]:[...paras],superseded:false,previous:previous?.id};
    s.turns.push(t);s.input='';s.scroll=0;state.view='chat';state.running={sessionId:s.id,turnId:t.id};render();
    clearInterval(streamTimer);streamTimer=setInterval(()=>{
      t.shown++;if(state.scenario==='network'&&t.shown===2){t.status='error';clearInterval(streamTimer);state.running=null;}else if(t.shown>=t.paragraphs.length){t.status='complete';clearInterval(streamTimer);state.running=null;if(previous)previous.superseded=true;}
      if(state.view==='chat'&&state.active===s.id){const e=$('#chat-scroll'),bottom=!e||e.scrollHeight-e.scrollTop-e.clientHeight<90;const before=e?.scrollTop||0;render();const after=$('#chat-scroll');if(after){after.scrollTop=bottom?after.scrollHeight:before;s.scroll=after.scrollTop;if(!bottom&&!$('#new-content')){after.insertAdjacentHTML('beforeend','<button class="new-content" id="new-content" data-action="latest">有新内容 ↓</button>');}}}
    },650);
  }
  function stop(){if(!state.running)return;const s=state.sessions.find(x=>x.id===state.running.sessionId);const t=s.turns.find(x=>x.id===state.running.turnId);t.status='stopped';clearInterval(streamTimer);state.running=null;render();toast('已保留未完成回答，可以按原范围重试。');}

  function addSelection(send=false){if(!state.selection){toast('请先选择一段文字或框选示例区域。');return;}session().context={...state.selection};state.view='chat';render();if(send){session().input=state.selection.type==='region'?'请解释这张图如何表达证据与结论的关系。':'请解释这段话的核心观点，并说明适用条件。';toast('已加入材料，正在生成模拟回答。');start();}else {toast('已加入本轮材料，尚未发送。');$('#prompt')?.focus();}}
  function createDraft(t,fragment=''){
    if(state.draft){modal('<h3 id="modal-title">已有一份未完成的草稿</h3><p>原型每次保留一份草稿。请先继续并保存，或明确放弃原稿，再整理新的知识点。</p><div class="dialog-actions"><button class="plain" data-action="close-modal">返回对话</button><button class="primary" data-action="continue-existing-draft">继续原草稿</button></div>');return;}
    rememberScroll();state.draft={turn:t,selection:fragment||t.paragraphs.join('\n\n'),fragment:!!fragment,title:fragment?'证据相关性与覆盖率需要分别核查':'相关证据是检索增强有效的前提',body:fragment?'相关性表示证据是否回应研究问题，覆盖率表示重要条件是否得到充分支持。两者应分别核查，避免将局部相关证据推广为普遍结论。':'检索增强能否提升回答质量，取决于证据与问题的相关性，以及材料是否覆盖了关键条件。\n\n阅读和比较方法时，应同时记录支持观点的证据与缺少的条件，避免把“使用了检索”等同于“结论一定可靠”。',paper:!!t.context&&(!fragment||t.paragraphs[1].includes(fragment)||fragment.includes(t.paragraphs[1])),needsReview:true,status:'dirty',revision:'',revisionBase:'',oldBody:'',version:0,revisionVersion:0,revisionRunning:false,saveFailed:false};state.view='draft';render();toast(fragment?'已根据所选片段生成模拟卡片草稿。':'已生成模拟卡片草稿，原始问答保留。');
  }
  function draftView(){const d=state.draft;if(!d){state.view='chat';return chatView();}return `<div class="panel-subhead"><button class="icon" data-action="back-chat" aria-label="返回对话">${icon('back')}</button><h3>卡片草稿</h3><span class="small muted" id="draft-status">${d.saveFailed?'保存失败':'待确认'}</span></div><div class="content-scroll"><div class="draft-hero"><div class="draft-icon">${icon('cards')}</div><div><h3>把理解，留下来。</h3><p class="small muted" style="font-size:11px">AI 整理草稿 · 可修改后加入卡片</p></div></div><label class="field">卡片标题<input id="draft-title" aria-label="卡片标题" value="${esc(d.title)}" maxlength="120"></label><label class="field">你的理解<textarea id="draft-body" aria-label="卡片正文">${esc(d.body)}</textarea></label><label class="checkbox"><input id="needs-review" type="checkbox" ${d.needsReview?'checked':''}>待核查</label>${sourcesBox(d)}${d.turn.context?`<label class="checkbox"><input id="paper-source" type="checkbox" ${d.paper?'checked':''}>保留可定位的论文依据（移除后仅保留对话来源）</label>`:''}${!d.paper?'<div class="alert">仅对话来源 · 尚未建立可核对的直接论文依据。</div>':''}<div class="revision"><h4>${icon('spark')} 请 AI 帮我修订</h4><textarea id="revision-prompt" aria-label="AI 修订要求" placeholder="例如：压缩到 100 字，突出适用条件">${esc(d.revisionPrompt||'')}</textarea><button class="secondary" data-action="revise" style="margin-top:8px;width:100%" ${d.revisionRunning?'disabled':''}>${d.revisionRunning?'正在生成模拟建议…':'生成修订建议'}</button>${d.revision?`<div class="revision-preview"><span class="pill">独立修订预览 · 尚未应用</span>${d.version!==d.revisionVersion?'<div class="alert">基于较早版本。正文已变化，请重新生成，避免覆盖新输入。</div>':''}<p>${esc(d.revision)}</p><div class="row"><button class="primary" data-action="apply-revision" ${d.version!==d.revisionVersion?'disabled':''}>应用修改</button><button class="plain" data-action="cancel-revision">取消建议</button></div></div>`:''}${d.oldBody?'<button class="view-link" data-action="undo-revision" style="margin-top:10px">恢复应用前的正文</button>':''}</div>${d.saveFailed?'<div class="alert error" role="alert">模拟保存失败，编辑内容仍保留在本次原型内。点击下方重试。</div>':''}<p class="small muted" style="font-size:11px;margin-top:15px">原始问答不受编辑影响。返回或收起面板会保留草稿；真实刷新恢复仍待开发。</p></div><div class="panel-footer"><button class="plain" data-action="discard-draft">放弃草稿</button><button class="primary" id="save-card" data-action="save-card" ${!d.title.trim()||!d.body.trim()?'disabled':''}>${icon('plus')} ${d.saveFailed?'重试加入卡片':'加入卡片'}</button></div>`;}
  function sourcesBox(d){return `<div class="source-box"><h4>保留这次理解的来处</h4>${d.paper?`<button class="source-item" data-action="paper-source"><strong>${icon('file')} 论文依据 · PDF 第 3 页</strong><p>${d.turn.context?.type==='region'?'图 2 · 证据路径的所选区域':'“Retrieval improves factual accuracy…”'}</p><span class="link">查看原文 →</span></button>`:''}<button class="source-item" data-action="conversation-source"><strong>${icon('history')} 相关对话 · ${d.turn.time}</strong><p>${esc(d.turn.question)}</p><span class="link">查看原始问答${d.fragment?'与所选片段':''} →</span></button></div>`;}
  function cardView(){const c=state.card;if(!c){state.view='chat';return chatView();}return `<div class="panel-subhead"><button class="icon" data-action="back-chat" aria-label="返回对话">${icon('back')}</button><h3>知识卡片</h3><span class="pill">${icon('check')} 已保存</span></div><div class="content-scroll"><div class="eyebrow muted" style="margin-bottom:12px">KNOWLEDGE, WITH CONTEXT</div><h3 style="font-size:20px;line-height:1.6;margin-bottom:17px">${esc(c.title)}</h3><div class="small" style="font-size:13px;line-height:1.95;white-space:pre-wrap">${esc(c.body)}</div><div class="row" style="margin:16px 0;flex-wrap:wrap">${c.needsReview?'<span class="pill warm">待核查</span>':''}<span class="pill">${c.paper?'论文 + 对话双来源':'仅对话来源'}</span></div><div class="divider"></div><p class="small muted" style="font-size:11px;margin-top:14px">已加入研究：检索增强，何时有效？</p>${sourcesBox(c)}<div class="alert" style="font-size:11px">论文帮助核对事实；对话保留解释过程。引用可定位不等于观点已经得到证实。</div></div><div class="panel-footer"><button class="plain" data-action="view-cards">打开卡片库</button><button class="primary" data-action="back-chat">继续讨论</button></div>`;}
  function openSource(kind,turn=null){rememberScroll();state.sourceBack=state.view;state.source={kind,item:turn?{turn,selection:turn.paragraphs.join('\n\n'),paper:!!turn.context}:state.view==='draft'?state.draft:state.card};state.view='source';render();}
  function sourceView(){const src=state.source,d=src.item,t=d.turn;return `<div class="panel-subhead"><button class="icon" data-action="back-source" aria-label="返回来源入口">${icon('back')}</button><h3>${src.kind==='paper'?'论文依据':'相关对话'}</h3><span class="pill" style="font-size:11px">创建时来源</span></div><div class="content-scroll source-view">${src.kind==='paper'?`<div class="eyebrow muted">PAPER EVIDENCE</div><h3>Adaptive Retrieval:<br>Evidence & Reliability</h3><p class="small muted">自制研究材料 · PDF 第 3 页 / 共 3 页</p><div class="source-page"><div class="eyebrow">RESEARCH MATERIAL / PAGE 03</div><h3>3. Conditions for evidence-grounded answers</h3>${t.context?.type==='region'?`<div class="diagram" style="padding:15px 8px;border:2px solid #87ad70"><div class="diagram-flow"><div class="diagram-node">Question</div><span>→</span><div class="diagram-node">Evidence</div><span>→</span><div class="diagram-node">Conclusion</div></div><div class="diagram-foot">图 2 · 所选区域（示意）</div></div>`:`<p><mark>${esc(t.context?.text||quote)}</mark></p>`}<p style="margin-top:17px;color:#809074">Both relevance and coverage should be recorded when comparing methods.</p></div><dl class="meta-grid"><dt>保存内容</dt><dd style="margin:0">${t.context?.type==='region'?'区域说明与位置示意':'原文摘录、PDF 页码与文档关联'}</dd><dt>说明</dt><dd style="margin:0">本预览为 HTML 示意；真实 PDF 定位与 hash 校验待开发。</dd></dl><button class="secondary" data-action="open-paper-main" style="width:100%">${icon('book')} 在主区打开此页</button>`:`<div class="eyebrow muted">CONVERSATION SOURCE</div><h3>当时，如何形成这个理解？</h3><p class="small muted">当前研究 · ${t.time} · 模拟文本模型</p><div class="section-title">原始问题</div><div class="question" style="margin:0">${esc(t.question)}</div><div class="section-title">原始回答 <span class="pill" style="margin-left:5px;font-size:11px">${d.fragment?'已高亮整理片段':'整条回答来源'}</span></div><div class="answer-snapshot">${d.fragment?`<mark style="background:#f0dfb0;color:inherit">${esc(d.selection)}</mark>`:t.paragraphs.map(p=>`<p style="margin:0 0 10px">${esc(p)}</p>`).join('')}</div>${d.fragment?`<details class="small muted" style="font-size:11px"><summary style="cursor:pointer;color:#467d54">展开完整回答与前后文</summary><p style="margin-top:12px;white-space:pre-wrap">${esc(t.paragraphs.join('\n\n'))}</p></details>`:''}<div class="section-title">本次实际使用范围（模拟）</div><div class="source-box"><div class="source-item"><strong>${t.context?'1 条论文证据 · PDF 第 3 页':'无直接论文证据'}</strong><p>${t.historyCount} 轮已完成前序问答 · 不含未完成回答</p></div></div><p class="small muted" style="font-size:11px">卡片修改不会覆盖此回答。未来归档会话后，已引用快照仍应可回查。</p><button class="secondary" data-action="continue-source" style="width:100%;margin-top:19px">${icon('history')} 继续此对话</button>`}</div><div class="panel-footer"><span class="small muted" style="font-size:11px">默认在右侧查阅，主区保持当前任务</span><button class="plain" data-action="back-source">返回</button></div>`;}
  function historyView(){const items=state.sessions.filter(s=>s.title.includes(state.search));return `<div class="panel-subhead"><button class="icon" data-action="back-chat" aria-label="返回当前对话">${icon('back')}</button><h3>阅读对话</h3><span class="small muted">当前研究</span></div><div class="content-scroll"><div class="eyebrow muted" style="margin-bottom:14px">A RECORD OF YOUR THINKING</div><input type="search" class="search" id="history-search" aria-label="搜索会话" placeholder="搜索对话标题…" value="${esc(state.search)}"><div id="history-results">${items.length?items.slice().reverse().map(s=>`<button class="history-item ${s.id===state.active?'active':''}" data-action="open-session" data-id="${s.id}"><h4>${esc(s.title)}</h4><p>${s.turns.length?esc(s.turns.at(-1).question):'新会话 · 尚未发送问题'}</p><div class="row between" style="margin-top:10px"><span class="small muted" style="font-size:11px">${s.turns.length} 条问答记录${s.input?' · 有未发送输入':''}</span><span class="pill" style="font-size:11px">${s.id===state.active?'当前':'继续'} →</span></div></button>`).join(''):'<p class="small muted">没有找到符合标题的会话。清空搜索后重试。</p>'}</div><div class="alert" style="font-size:11px;margin-top:20px">历史仅保留在本次原型内。生产版将按研究持久化，并支持归档与恢复。</div></div><div class="panel-footer"><span class="small muted" style="font-size:11px">新对话不携带旧材料与历史</span><button class="primary" data-action="new-chat">${icon('plus')} 新对话</button></div>`;}
  function modal(html){$('#modal-content').innerHTML=html;$('#modal').showModal();}
  function fragmentDialog(t){state.fragmentTurn=t;modal(`<h3 id="modal-title">选择一个值得留下的知识点</h3><p>选中的段落会连同原始问题、完整回答和引用关系一起保存。</p>${t.paragraphs.map((p,i)=>`<label class="paragraph-option"><input type="radio" name="fragment" value="${i}" ${i===1?'checked':''}><span>${esc(p)}</span></label>`).join('')}<div class="dialog-actions"><button class="plain" data-action="close-modal">取消</button><button class="primary" data-action="confirm-fragment">整理所选片段</button></div>`);}
  function save(){const d=state.draft;if(!d||!d.title.trim()||!d.body.trim())return;if(state.scenario==='save'&&!d.saveFailed){d.saveFailed=true;d.status='error';render();toast('已模拟保存失败，草稿完整保留。');return;}const c={...d,id:++state.counter,status:'saved'};state.cards.push(c);state.card=c;state.draft=null;state.view='card';render();if(state.main==='cards')renderMain();toast('已加入当前研究的卡片库，论文与对话来源已保留（模拟）。');}
  function revise(){const d=state.draft;if(!d||d.revisionRunning)return;d.revisionBase=d.body;d.revisionVersion=d.version;d.revisionRunning=true;d.revision='';render();clearTimeout(revisionTimer);revisionTimer=setTimeout(()=>{if(state.draft!==d)return;d.revisionRunning=false;d.revision='检索增强的效果依赖相关且充分的证据。仅找到相关材料，不代表关键条件已被覆盖；记录观点时，应同时注明支持依据与尚待核查的限制。';if(state.view==='draft')render();toast('模拟修订建议已就绪，应用前请核对。');},1100);}
  function showRegionBox(x,y,w,h){const b=$('#region-box');if(!b)return;Object.assign(b.style,{display:'block',left:x+'px',top:y+'px',width:w+'px',height:h+'px'});}
  function bindDiagram(){const diagram=$('#diagram');if(!diagram)return;let startPoint=null;diagram.addEventListener('pointerdown',e=>{if(state.mode!=='region')return;const r=diagram.getBoundingClientRect();startPoint={x:e.clientX-r.left,y:e.clientY-r.top};diagram.setPointerCapture(e.pointerId);e.preventDefault();});diagram.addEventListener('pointermove',e=>{if(!startPoint)return;const r=diagram.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left)),y=Math.max(0,Math.min(r.height,e.clientY-r.top));showRegionBox(Math.min(x,startPoint.x),Math.min(y,startPoint.y),Math.abs(x-startPoint.x),Math.abs(y-startPoint.y));});diagram.addEventListener('pointerup',()=>{if(!startPoint)return;startPoint=null;setSelection('图 2 · 研究问题 → 相关证据 → 有边界的结论','region');toast('已框选示例图区域。点击“向 AI 提问”加入材料。');});}
  function about(){modal('<h3 id="modal-title">这是可点击的设计原型</h3><p>用于评审“阅读 → 对话 → 卡片 → 来源”的操作。论文是自制 HTML 样例，AI 回答与修订均为预设内容；不会发送到模型，也不读写生产数据。</p><p>可点击“选取示例段落”开始；上方场景菜单可演示中断、保存失败和恢复提示。页面状态只在内存保留，刷新会重置。区域框选是 R2 示意。</p><div class="dialog-actions"><button class="primary" data-action="close-modal">开始体验</button></div>');}
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,id=Number(b.dataset.id),s=session(),t=s.turns.find(t=>t.id===id);if(action!=='close-panel'&&!b.closest('#inspector')&&!b.closest('dialog'))panelOpener=b;
    switch(action){
      case 'toggle-nav':app.classList.toggle('collapsed');break;
      case 'view-paper':state.main='paper';renderMain();break;
      case 'view-cards':state.main='cards';renderMain();break;
      case 'open-panel':openPanel();$('.panel-head button')?.focus();break;
      case 'close-panel':closePanel();break;
      case 'history':rememberScroll();state.view='history';state.search='';render();break;
      case 'new-chat':rememberScroll();state.sessions.push({id:++state.counter,title:'新的阅读对话',input:'',context:null,history:'all',turns:[],scroll:0});state.active=state.counter;state.view='chat';render();$('#prompt').focus();toast('新对话未携带任何旧材料或问答。');break;
      case 'open-session':rememberScroll();state.active=id;state.view='chat';render();break;
      case 'select-text':setSelection(quote);toast('已选择示例段落，尚未加入 AI。');break;
      case 'text-mode':state.mode='text';state.selection=null;renderMain();break;
      case 'region-mode':state.mode='region';state.selection=null;renderMain();toast('R2 框选示意：在图示上拖动，或点击“框选示例图”。');break;
      case 'area-example':setSelection('图 2 · 研究问题 → 相关证据 → 有边界的结论','region');showRegionBox(8,8,$('#diagram').clientWidth-16,$('#diagram').clientHeight-16);break;
      case 'clear-selection':state.selection=null;window.getSelection()?.removeAllRanges();renderMain();break;
      case 'add-selection':addSelection();break;
      case 'explain':addSelection(true);break;
      case 'clear-context':s.context=null;render();toast('已移除本轮材料；前序消息仍可能包含旧材料。');break;
      case 'preview-context':modal(`<h3 id="modal-title">本轮材料 · PDF 第 3 页</h3><p>${esc(s.context?.text)}</p><p>本原型不会实际发送材料。生产版提交后保存此时的固定快照。</p><div class="dialog-actions"><button class="primary" data-action="close-modal">返回提问</button></div>`);break;
      case 'quick':s.input=b.dataset.prompt;render();$('#prompt').focus();break;
      case 'send':start();break;
      case 'stop':stop();break;
      case 'retry':state.scenario='normal';$('#scenario').value='normal';start(t.question,t);break;
      case 'regenerate':modal(`<h3 id="modal-title">按当前范围重新生成</h3><p>保留原回答，以新记录回答最新一轮问题。当前范围：${s.context?1:0} 条材料、${selectedHistory(s).filter(x=>x!==t).length} 轮前序问答（不含本轮）。已有卡片仍引用原记录。</p><div class="dialog-actions"><button class="plain" data-action="close-modal">取消</button><button class="primary" data-action="confirm-regenerate" data-id="${id}">确认模拟生成</button></div>`);break;
      case 'confirm-regenerate':$('#modal').close();start(t.question,null,t);break;
      case 'draft':if(t?.status==='complete')createDraft(t);break;
      case 'fragment':fragmentDialog(t);break;
      case 'confirm-fragment':{const i=Number($('input[name="fragment"]:checked')?.value||0);$('#modal').close();createDraft(state.fragmentTurn,state.fragmentTurn.paragraphs[i]);break;}
      case 'native-fragment':if(state.selectedTurn)createDraft(state.selectedTurn,state.selectedFragment);break;
      case 'copy':navigator.clipboard?.writeText(t.paragraphs.join('\n\n')).then(()=>toast('已复制模拟回答。')).catch(()=>toast('浏览器未授予剪贴板权限；可选中文字复制。'));if(!navigator.clipboard)toast('可选中回答文字，使用系统快捷键复制。');break;
      case 'back-chat':rememberScroll();state.view='chat';render();break;
      case 'resume-draft':rememberScroll();state.view='draft';render();break;
      case 'continue-existing-draft':$('#modal').close();state.view='draft';render();break;
      case 'revise':revise();break;
      case 'apply-revision':if(state.draft.version===state.draft.revisionVersion){state.draft.oldBody=state.draft.body;state.draft.body=state.draft.revision;state.draft.version++;state.draft.revision='';render();toast('已应用修改；原始回答保持原样。');}break;
      case 'cancel-revision':state.draft.revision='';render();break;
      case 'undo-revision':state.draft.body=state.draft.oldBody;state.draft.oldBody='';state.draft.version++;render();break;
      case 'save-card':save();break;
      case 'discard-draft':modal('<h3 id="modal-title">放弃这份卡片草稿？</h3><p>草稿的编辑会被移除，原始对话与论文证据继续保留。只想暂时离开，可以返回对话。</p><div class="dialog-actions"><button class="plain" data-action="close-modal">保留草稿</button><button class="primary" data-action="confirm-discard">放弃草稿</button></div>');break;
      case 'confirm-discard':$('#modal').close();state.draft=null;state.view='chat';render();break;
      case 'open-card':state.card=state.cards.find(c=>c.id===id);state.view='card';render();break;
      case 'paper-source':openSource('paper');break;
      case 'conversation-source':openSource('conversation');break;
      case 'turn-source':openSource('paper',t);break;
      case 'back-source':state.view=state.sourceBack;render();break;
      case 'open-paper-main':state.main='paper';setSelection(state.source.item.turn.context?.text||quote,state.source.item.turn.context?.type||'text');renderMain();if(matchMedia('(max-width:1100px)').matches)closePanel();toast('已在主区定位示例页；可在右侧继续回查来源。');break;
      case 'continue-source':{const owner=state.sessions.find(s=>s.turns.some(x=>x.id===state.source.item.turn.id));if(owner)state.active=owner.id;state.view='chat';render();$('#prompt').focus();break;}
      case 'latest':$('#chat-scroll').scrollTop=$('#chat-scroll').scrollHeight;b.remove();break;
      case 'close-modal':$('#modal').close();break;
      case 'about':about();break;
    }
  });
  document.addEventListener('input',e=>{const el=e.target,d=state.draft;if(el.id==='prompt'){session().input=el.value;const send=$('[data-action="send"]');if(send)send.disabled=!el.value.trim();}else if(el.id==='draft-title'||el.id==='draft-body'){if(!d)return;d[el.id==='draft-title'?'title':'body']=el.value;d.version++;d.status='dirty';$('#draft-status').textContent='待确认';$('#save-card').disabled=!d.title.trim()||!d.body.trim();if(d.revision){const apply=$('[data-action="apply-revision"]');if(apply)apply.disabled=true;}}else if(el.id==='revision-prompt'&&d)d.revisionPrompt=el.value;else if(el.id==='history-search'){state.search=el.value;const start=el.selectionStart;$('#panel').innerHTML=historyView();$('#history-search').focus();$('#history-search').setSelectionRange(start,start);}});
  document.addEventListener('change',e=>{const el=e.target;if(el.id==='history-range'){session().history=el.value;render();}else if(el.id==='paper-source'){state.draft.paper=el.checked;render();}else if(el.id==='needs-review')state.draft.needsReview=el.checked;else if(el.id==='scenario'){state.scenario=el.value;if(el.value==='about'){about();el.value='normal';state.scenario='normal';}else if(el.value==='recovery'){state.restored=true;state.view='chat';render();toast('模拟恢复提示；原型真实刷新会重置。');}else if(el.value==='network')toast('下一次模拟回答将在第二段中断，可重试。');else if(el.value==='save')toast('下一次加入卡片将模拟失败，随后可重试。');else {state.restored=false;render();}}});
  document.addEventListener('keydown',e=>{if(e.isComposing)return;if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&e.target.id==='prompt'){e.preventDefault();start();}if(e.key==='Escape'&&!$('#modal').open){if(state.mode==='region'){state.mode='text';renderMain();}else if(matchMedia('(max-width:1100px)').matches)closePanel();}if(e.key==='Tab'&&matchMedia('(max-width:1100px)').matches&&!app.classList.contains('panel-closed')&&!$('#modal').open){const list=[...$('#inspector').querySelectorAll('button:not(:disabled),input,textarea,select,[tabindex="0"]')].filter(x=>x.getClientRects().length);if(!list.length)return;const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  document.addEventListener('pointerup',()=>{clearTimeout(selectionTimer);selectionTimer=setTimeout(()=>{const sel=window.getSelection();if(!sel||sel.isCollapsed||!sel.toString().trim())return;const node=sel.anchorNode?.parentElement,end=sel.focusNode?.parentElement;if(state.mode==='text'&&node?.closest('#paper')&&end?.closest('#paper')){setSelection(sel.toString().trim());}else if(node?.closest('[data-answer]')&&node.closest('[data-answer]')===end?.closest('[data-answer]')){const id=Number(node.closest('[data-answer]').dataset.answer),t=session().turns.find(t=>t.id===id);if(t?.status!=='complete')return;state.selectedTurn=t;state.selectedFragment=sel.toString().trim();const article=node.closest('.message');if(!article.querySelector('[data-action="native-fragment"]'))article.querySelector('.message-actions').insertAdjacentHTML('afterbegin','<button class="primary" data-action="native-fragment" style="font-size:11px">将选中片段整理为卡片</button>');}},30);});
  $('#resize').addEventListener('pointerdown',e=>{if(matchMedia('(max-width:1100px)').matches)return;const move=ev=>{const left=parseInt(getComputedStyle(app).getPropertyValue('--left'))||240,max=Math.min(520,innerWidth-left-640),w=Math.max(320,Math.min(max,innerWidth-ev.clientX));app.style.setProperty('--right',w+'px');$('#resize').setAttribute('aria-valuenow',Math.round(w));};const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);e.preventDefault();});
  $('#resize').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const current=Number($('#resize').getAttribute('aria-valuenow')),left=parseInt(getComputedStyle(app).getPropertyValue('--left'))||240,w=Math.max(320,Math.min(520,innerWidth-left-640,current+(e.key==='ArrowLeft'?16:-16)));app.style.setProperty('--right',w+'px');$('#resize').setAttribute('aria-valuenow',w);});
  window.addEventListener('resize',syncDrawer);
  // shortcut: the prototype models one research in memory; production isolation and durable recovery are defined in the UX spec.
  renderMain();render();syncDrawer();
  console.assert(state.sessions.length===1&&state.cards.length===0,'Prototype starts without saved cards or external data.');
})();
</script>
