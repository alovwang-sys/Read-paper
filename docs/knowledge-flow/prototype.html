<style>

.meta-grid{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;font-size:13px;margin-top:18px}.meta-grid span:nth-child(odd){color:var(--muted)}

.box{width:16px;height:16px;border:1.5px solid #b9c1c7;border-radius:4px;margin-top:3px;display:grid;place-items:center;color:#fff}.ex.sel .box{background:var(--accent);border-color:var(--accent)}
blockquote{margin:0;font-family:Georgia,"Songti SC",serif;font-size:15px;line-height:1.7;border-left:3px solid #e6c95a;padding-left:10px}.ex-meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-top:5px;flex-wrap:wrap}
.selbar{position:sticky;bottom:16px;margin:18px auto 0;width:max-content;max-width:100%;display:flex;align-items:center;gap:8px;background:#26323a;color:#fff;border-radius:10px;padding:8px 10px 8px 16px;box-shadow:0 8px 28px #0000003a;font-size:13px}.selbar button{color:#fff}.selbar button:hover{background:#ffffff22}.selbar .primary{background:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:8px;position:relative}.card:hover{border-color:#c9d2d8;box-shadow:0 2px 8px #0000000d}.card-t{font-weight:600}.card-b{font-size:13px;color:#56616b;line-height:1.6}.card-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.menu{position:absolute;z-index:5;left:12px;bottom:-8px;transform:translateY(100%);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0000001f;padding:6px;min-width:200px}.menu button{display:block;width:100%;text-align:left;font-size:13px}.menu .tiny{padding:4px 10px}

.board{padding:18px 22px;height:100%;display:flex;flex-direction:column;background:#f8f9f7;background-image:radial-gradient(#dfe3df 1px,transparent 1px);background-size:18px 18px}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;flex:1;min-height:0}
.lane{border:1px dashed #c6d0cb;border-radius:12px;padding:10px;background:#ffffffb0;display:flex;flex-direction:column;gap:8px;overflow-y:auto}.lane-h{font-size:13px;font-weight:600;color:#4b5a54;display:flex;justify-content:space-between;padding:2px 4px 4px}
.mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;font-size:13px}.mini:hover{border-color:var(--accent)}.mini b{display:block;margin-bottom:4px}
/* draft */
.docpage{max-width:740px;margin:0 auto;padding:30px 40px 80px}.docpage p{font-size:16px;line-height:1.9;margin:0 0 14px}.cite{font-size:12px;color:var(--accent-d);background:var(--soft);padding:0 5px;min-height:0;border-radius:4px;vertical-align:2px;margin:0 1px}.cite.on{background:var(--accent);color:#fff}
.refs{border-top:1px solid var(--line);margin-top:28px;padding-top:14px;font-size:13px}.refs li{margin-bottom:8px;color:#55616b}

.composer{flex:none;border-top:1px solid var(--line);padding:10px 12px}.ctx{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}.fake-input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--muted);font-size:13px}
/* overlays */
.scrim{position:fixed;inset:0;background:#1f2a3020;z-index:20}
.pop{position:fixed;z-index:21;background:#fff;border-radius:12px;box-shadow:0 18px 50px #00000030;border:1px solid var(--line)}

  const body = all.length ? groups.map(([s, l]) => { const ds = all.filter(d => st(d) === s && pass(d)); return ds.length ? `<div class="group-h">${l} · ${ds.length}</div>${ds.map(docRow).join('')}` : ''; }).join('')

  return `<div class="page">
    <div class="page-head"><div><h1>资料</h1><p>这个研究收下的论文、文章和网页。不必每篇都精读，略读过也算读过。</p></div>
      <button class="primary" data-a="add">${ic('plus', 15)} 添加资料 <kbd>A</kbd></button></div>
    <div class="filters">${chip('all', '全部')}${chip('reading', '在读')}${chip('unread', '未读')}${chip('read', '读过')}${chip('nofull', '无全文', all.filter(d => !d.full).length)}
      <span class="find">${ic('search', 14)} 搜索标题、作者或标识</span></div>
    ${body}
    <div class="hint">${ic('up', 14)} 可直接把 PDF 拖进窗口。收下的资料同时保存在资料库，换个研究也能复用。<button class="link" data-a="panelmode" data-m="ai">AI 推荐的资料</button>也会出现在对话里，一键加入。</div>
  </div>`;
}

// ---------- 阅读 ----------
function reader(d) {
  if (!d.full) return `<div class="page">
    <div class="tiny muted">文献条目 · ${esc(d.origin)}</div><h1>${esc(d.title)}</h1>
    <div class="meta-grid"><span>作者</span><span>${esc(d.authors)}</span><span>年份</span><span>${d.year}</span><span>标识</span><span>${esc(d.ident || '—')}</span><span>用于</span><span>${d.rs.map(r => S.researches.find(x => x.id === r).title).join('、') || '未加入研究'}</span></div>
    <div class="empty" data-a="attach" data-id="${d.id}" style="cursor:copy">${ic('up', 28)}<b>把这篇的 PDF 拖到这里，就能开始阅读</b>没找到开放全文。可以从原链接下载后拖入，或 <button class="link">选择文件</button><br><span class="tiny">文献信息已经保存；补上全文后，这一条直接变为可读，不会产生重复资料</span></div>
  </div>`;
  const pk = S.pick && S.pick.startsWith(d.id + ':') ? S.pick.split(':')[1] : null;
  const exHere = S.excerpts.filter(e => e.doc === d.id && !e.dismissed);
  const finding = W().sub && W().sub.type === 'find' ? card(W().sub.id) : null;
  const para = sec => {
    let tool = '';
    const html = sec.p.map(x => {
      if (!Array.isArray(x)) return esc(x);
      const [sid, text] = x, e = exOf(d.id, sid), cls = ['sent'];
      if (e) cls.push('hl'); if (pk === sid) cls.push('pick'); if (S.flash === `${d.id}:${sid}`) cls.push('flash');
      if (pk === sid) tool = e
        ? `<div class="seltool"><span class="tiny muted">已摘录 · PDF 第 ${sec.pg} 页</span>${e.card ? `<span class="chip ok">已用于卡片「${esc(short(card(e.card).title))}」</span>` : `<button class="primary sm" data-a="pickcard">写成卡片 <kbd>C</kbd></button>`}<button class="sm" data-a="pickai">${ic('ai', 13)} 问 AI</button><button class="sm" data-a="unexcerpt">取消摘录</button><button class="icon sm" data-a="unpick" aria-label="关闭">${ic('x', 13)}</button></div>`
        : `<div class="seltool"><span class="tiny muted">PDF 第 ${sec.pg} 页 · 已选 1 句</span>${finding ? `<button class="primary sm" data-a="attachpick">作为「${esc(short(finding.title))}」的依据</button>` : ''}<button class="${finding ? 'outline' : 'primary'} sm" data-a="capture">${ic('mark', 13)} 摘录 <kbd>H</kbd></button><button class="sm" data-a="pickcard">写成卡片 <kbd>C</kbd></button><button class="sm" data-a="pickai">${ic('ai', 13)} 问 AI</button><button class="icon sm" data-a="unpick" aria-label="关闭">${ic('x', 13)}</button></div>`;
      return `<span class="${cls.join(' ')}" data-a="pick" data-s="${d.id}:${sid}">${esc(text)}</span>`;
    }).join('');
    return `<h4>${sec.h}</h4><p>${html}</p>${tool}`;
  };
  return `<div class="reader">
    <div class="rtool"><button class="icon" aria-label="目录">${ic('toc')}</button><span>‹</span><span class="pg">${d.page || 1}</span><span class="muted">/ ${d.pages}</span><span>›</span><span class="muted">100%</span>
      <span class="st">全文可读 · 文本可选 · 本篇摘录 ${exHere.length}</span>
      ${d.status === 'read' || d.status === 'skim' ? `<span class="chip ok">${ic('check', 11)} ${d.status === 'skim' ? '略读过' : '读完'}</span>` : `<button class="outline sm" data-a="markread" data-id="${d.id}" data-s="skim">略读过</button><button class="outline sm" data-a="markread" data-id="${d.id}" data-s="read">读完</button>`}</div>
    ${d.status === 'read' && exHere.length && !d.nudged ? `<div class="nudge">${ic('check', 15)}<span class="grow">读完了。要不要用一两句话记下：这篇对你的问题有什么用？</span><button class="primary sm" data-a="summarize" data-id="${d.id}">写一张要点卡片</button><button class="sm" data-a="nonudge" data-id="${d.id}">不用</button></div>` : ''}
    <div class="rbody"><div class="paper">
      <div class="pk">示例论文 · 合成测试材料</div><h2>${esc(d.title)}</h2><div class="tiny muted" style="font-family:-apple-system,sans-serif">${esc(d.authors)} · ${d.year} · 点击任意高亮或带下划线的句子模拟选中原文</div>
      ${pageOf(d.id).map(para).join('')}
      <div class="pgend">— 示例页结束 —${d.status !== 'read' ? `<button class="link" data-a="markread" data-id="${d.id}" data-s="read">读完这篇了</button>` : ''}</div>
    </div></div>
  </div>`;
}

// ---------- 摘录 ----------
function excerpts() {
  const f = S.filter.excerpts, all = exR();
  const list = all.filter(e => f === 'all' || (f === 'pending' ? !e.card : e.card));
  const byDoc = [...new Set(list.map(e => e.doc))];
  const chip = (v, l, n) => `<button class="${f === v ? 'on' : ''}" data-a="filter" data-f="excerpts" data-v="${v}">${l} ${n}</button>`;
  const item = e => `<div class="ex ${S.sel.includes(e.id) ? 'sel' : ''} ${e.card ? 'used' : ''}" ${e.card ? `data-a="viewcard" data-id="${e.card}"` : `data-a="sel" data-id="${e.id}"`} tabindex="0">
      <span class="box">${e.card ? '' : ic('check', 11)}</span>
      <div><blockquote>${esc(e.quote)}</blockquote>
      <div class="ex-meta"><span>PDF 第 ${e.pg} 页</span>${e.note ? `<span>· 随手记：${esc(e.note)}</span>` : ''}${e.card ? `<span class="chip ok">→ 卡片「${esc(card(e.card).title)}」</span>` : ''}<button class="link" data-a="jump" data-id="${e.id}">看原文</button></div></div></div>`;
  return `<div class="page">
    <div class="page-head"><div><h1>摘录</h1><p>阅读时留下的原文。有的会写成卡片，有的只是留着备查，都可以。</p></div></div>
    <div class="filters">${chip('all', '全部', all.length)}${chip('pending', '还没用到', all.filter(e => !e.card).length)}${chip('done', '已用于卡片', all.filter(e => e.card).length)}</div>
    ${list.length ? byDoc.map(id => `<div class="group-h">${ic('file', 13)} ${esc(doc(id).title)} · ${list.filter(e => e.doc === id).length} 条 <button class="link" data-a="open" data-k="doc" data-id="${id}">打开原文</button></div>${list.filter(e => e.doc === id).map(item).join('')}`).join('')
      : `<div class="empty">${ic('check', 26)}<b>${f === 'pending' ? '摘录都已用上' : '还没有摘录'}</b>阅读时选中句子按 H，就会出现在这里</div>`}
    ${S.sel.length ? `<div class="selbar">已选 ${S.sel.length} 条<button class="primary" data-a="writecard">写成一张卡片</button><button data-a="aicard">${ic('ai', 13)} AI 起草</button><button data-a="dismiss">不需要</button><button data-a="clearsel">取消</button></div>` : ''}
  </div>`;
}

// ---------- 卡片 ----------
function cardSrc(c) { const ex = c.ex.map(id => S.excerpts.find(e => e.id === id)).filter(Boolean); return ex.length ? ex.map(e => `<span class="chip">${ic('mark', 11)} ${esc(short(doc(e.doc).title))} · 第 ${e.pg} 页</span>`).join('') : '<span class="chip warn">无原文依据</span>'; }
function placeMenu(c) {
  return `<div class="menu" role="menu"><div class="tiny muted">放到白板的哪个区域？</div>${boardsR().map(b => b.secs.map((s, i) => `<button data-a="place" data-id="${c.id}" data-b="${b.id}" data-s="${i}">${esc(b.title)} · ${esc(s)}</button>`).join('')).join('')}</div>`;
}
function cards() {
  const f = S.filter.cards, all = cardsR();
  const list = all.filter(c => f === 'all' || (f === 'review' ? c.review : !c.place));
  const chip = (v, l, n) => `<button class="${f === v ? 'on' : ''}" data-a="filter" data-f="cards" data-v="${v}">${l} ${n}</button>`;
  return `<div class="page">
    <div class="page-head"><div><h1>卡片</h1><p>用自己的话写下的理解。一张卡片只讲一件事，可用在多块白板和多个研究里。</p></div>
      <div><button class="outline" data-a="toast" data-m="从资料库挑其他研究的卡片；它引用的资料会一并加入本研究">添加已有卡片</button> <button class="primary" data-a="newcard">${ic('plus', 15)} 新卡片</button></div></div>
    <div class="filters">${chip('all', '全部', all.length)}${chip('review', '待核查', all.filter(c => c.review).length)}${chip('unplaced', '未上白板', all.filter(c => !c.place).length)}</div>
    <div class="grid">${list.map(c => `<div class="card" data-a="viewcard" data-id="${c.id}" tabindex="0">
      <div class="card-t">${esc(c.title)}</div><div class="card-b">${esc(c.body)}</div>
      <div class="card-f">${cardSrc(c)}</div>
      <div class="card-f">${c.review ? '<span class="chip warn">待核查</span>' : ''}${c.place ? `<span class="chip">${ic('board', 11)} ${esc(placeName(c))}</span>` : `<button class="link" data-a="placemenu" data-id="${c.id}">放到白板</button>`}${c.rs.length > 1 ? '<span class="chip">也用于其他研究</span>' : ''}</div>
      ${S.placeMenu === c.id ? placeMenu(c) : ''}
    </div>`).join('')}</div>
  </div>`;
}

// ---------- 白板与文稿 ----------
const listPage = (title, sub, items, k, newLabel) => `<div class="page"><div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><button class="primary" data-a="toast" data-m="新建后自动关联当前研究，并出现在左侧">${ic('plus', 15)} ${newLabel}</button></div>
  <div class="grid">${items.map(x => `<div class="card" data-a="open" data-k="${k}" data-id="${x.id}" tabindex="0"><div class="card-t">${esc(x.title)}</div><div class="card-b">${x.meta}</div></div>`).join('')}</div></div>`;
const boards = () => listPage('白板', '把卡片摆进论证结构：哪些支持、哪些是条件、哪些相互矛盾。同一张卡片可以出现在多块白板上。', boardsR().map(b => ({...b, meta:`${S.cards.filter(c => c.place && c.place.b === b.id).length} 张卡片 · ${b.secs.join(' / ')}`})), 'board', '新建白板');
const drafts = () => listPage('文稿', '把论证写成结论。插入卡片即带上引用，读者可以一路追溯到原文。', draftsR().map(w => ({...w, meta:`${w.paras.flat().filter(x => x.c).length} 处引用`})), 'draft', '新建文稿');
function board(b) {
  return `<div class="board"><div class="tiny muted" style="margin-bottom:10px">示意：真实白板是自由画布，这里用分区表示结构。点卡片在右侧查看，来源可回到原文。</div>
    <div class="lanes">${b.secs.map((s, i) => { const cs = S.cards.filter(c => c.place && c.place.b === b.id && c.place.s === i);
      return `<div class="lane"><div class="lane-h"><span>${esc(s)}</span><span class="muted">${cs.length}</span></div>${cs.map(c => `<div class="mini" data-a="viewcard" data-id="${c.id}" tabindex="0"><b>${esc(c.title)}</b><div class="card-f">${cardSrc(c)}${c.review ? '<span class="chip warn">待核查</span>' : ''}</div></div>`).join('')}${cs.length ? '' : '<div class="tiny muted" style="padding:8px">从右侧把卡片放进来</div>'}</div>`; }).join('')}</div></div>`;
}
function citeOrder(w) { const o = []; w.paras.flat().forEach(x => x.c && !o.includes(x.c) && o.push(x.c)); return o; }
function draft(w) {
  const order = citeOrder(w);
  return `<div class="docpage"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><span class="tiny muted">${ic('check', 12)} 已保存</span><button class="outline sm" data-a="toast" data-m="导出 Markdown：含文献信息、PDF 页码与摘录（不附原 PDF）">导出 Markdown</button></div>
    <h1>${esc(w.title)}</h1><p class="lead">回答：${esc(R().q)}</p>
    ${w.paras.map(p => `<p>${p.map(x => x.c ? `<button class="cite ${S.cite === x.c ? 'on' : ''}" data-a="cite" data-id="${x.c}" title="查看出处">[${order.indexOf(x.c) + 1}]</button>` : esc(x)).join('')}</p>`).join('')}
    <ol class="refs"><h3>来源</h3>${order.map(id => { const c = card(id), ex = c.ex.map(i => S.excerpts.find(e => e.id === i)); return `<li>${esc(c.title)} —— ${ex.length ? ex.map(e => `《${esc(doc(e.doc).title)}》PDF 第 ${e.pg} 页：“${esc(e.quote)}”`).join('；') : `<span class="warn">这张卡片还没有原文依据</span> <button class="link" data-a="find" data-id="${c.id}">找依据</button>`}</li>`; }).join('')}</ol>
  </div>`;
}

// ---------- 资料库 ----------
function library() {
  const tab = S.filter.libTab, f = S.filter.lib;
  const rname = id => S.researches.find(r => r.id === id).title;
  const chip = (v, l) => `<button class="${f === v ? 'on' : ''}" data-a="filter" data-f="lib" data-v="${v}">${l}</button>`;
  const ds = S.docs.filter(d => !d.loading && (f === 'all' || (f === 'none' ? !d.rs.length : d.rs.includes(S.research))));
  const cs = S.cards.filter(c => f === 'all' || (f === 'none' ? !c.rs.length : c.rs.includes(S.research)));
  const used = rs => rs.length ? rs.map(r => `<span class="chip">${esc(rname(r))}</span>`).join(' ') : '<span class="chip warn">未加入研究</span>';
  const act = (kind, x) => x.rs.includes(S.research) ? '<span class="tiny muted">已在本研究</span>' : `<button class="outline sm" data-a="${kind}" data-id="${x.id}">加入本研究</button>`;
  return `<div class="page">
    <div class="page-head"><div><h1>资料库</h1><p>所有研究共用。日常在研究里添加即可；这里用于跨研究查找、复用和整理。</p></div></div>
    <div class="filters"><button class="${tab === 'docs' ? 'on' : ''}" data-a="filter" data-f="libTab" data-v="docs">资料 ${S.docs.length}</button><button class="${tab === 'cards' ? 'on' : ''}" data-a="filter" data-f="libTab" data-v="cards">卡片 ${S.cards.length}</button><span style="width:14px"></span>${chip('all', '全部')}${chip('none', '未加入研究')}${chip('here', '本研究')}</div>
    ${tab === 'docs' ? ds.map(d => `<div class="row" style="grid-template-columns:22px minmax(0,1fr) auto 112px;cursor:default"><span class="muted">${ic(d.full ? 'file' : 'link')}</span><div><div class="row-title">${esc(d.title)}</div><div class="row-meta">${esc(d.authors)} · ${d.year}${d.full ? '' : ' · <span class="warn">无全文</span>'}</div><div class="row-acts">${used(d.rs)}</div></div><div></div><div class="row-state">${act('libadd', d)}</div></div>`).join('')
      : cs.map(c => `<div class="row" style="grid-template-columns:22px minmax(0,1fr) auto 112px;cursor:default"><span class="muted">${ic('card')}</span><div><div class="row-title">${esc(c.title)}</div><div class="row-meta">${esc(c.body)}</div><div class="row-acts">${used(c.rs)}</div></div><div></div><div class="row-state">${act('libcard', c)}</div></div>`).join('')}
  </div>`;
}

// ---------- 右侧面板 ----------
function panel(t) {
  const m = W().panel;
  const tabs = [['excerpts', '摘录'], ['cards', '卡片'], ['ai', 'AI']];
  return `<aside class="panel" aria-label="右侧面板"><div class="ph"><div class="seg">${tabs.map(([k, l]) => `<button class="${m === k ? 'on' : ''}" data-a="panelmode" data-m="${k}">${l}</button>`).join('')}</div><button class="icon" data-a="closepanel" aria-label="收起">${ic('x', 15)}</button></div>
    ${m === 'excerpts' ? `<div class="pb">${panelExcerpts(t)}</div>` : m === 'cards' ? `<div class="pb">${panelCards(t)}</div>` : panelAI()}</aside>`;
}
function panelExcerpts(t) {
  const here = t && t.k === 'doc';
  const list = here ? S.excerpts.filter(e => e.doc === t.id && !e.dismissed) : pending();
  return `<div class="pt">${here ? '本篇摘录' : '还没用到的摘录'}</div><div class="psub">${here ? '选中句子按 H 摘录，不打断阅读；想写卡片时随时可以写' : '需要时取用，不必清空'}</div>
    <div class="plist">${list.map(e => `<div class="it"><blockquote>${esc(e.quote)}</blockquote><div class="ex-meta"><span>${here ? '' : esc(short(doc(e.doc).title)) + ' · '}PDF 第 ${e.pg} 页</span>${e.card ? `<span class="chip ok">→ ${esc(short(card(e.card).title))}</span>` : `<button class="link" data-a="cardfrom" data-id="${e.id}">写成卡片</button>`}<button class="link" data-a="jump" data-id="${e.id}">定位</button></div></div>`).join('') || '<div class="tiny muted">还没有摘录</div>'}</div>`;
}
function panelCards(t) {
  const sub = W().sub;
  if (sub && sub.type === 'edit') {
    const ex = sub.ex.map(id => S.excerpts.find(e => e.id === id));
    return `<div class="pt">${sub.ai ? 'AI 草稿 · 待你确认' : '新卡片'}</div><div class="psub">用自己的话写一个观点。一张卡片只讲一件事。</div>
      <label>观点<input data-bind="title" value="${esc(sub.title)}" placeholder="一句话说清你的判断"></label>
      <label>你的理解<textarea data-bind="body" placeholder="为什么这么认为？在什么条件下成立？">${esc(sub.body)}</textarea></label>
      ${sub.ai ? `<div class="ai-note">AI 只根据下面 ${ex.length} 条摘录起草。请改成你的话再保存；保存后标为“待核查”。</div>` : ''}
      <div class="basis"><div class="tiny muted" style="margin-bottom:8px">依据 · ${ex.length} 条摘录${ex.length ? '' : '（可稍后从摘录补充）'}</div>${ex.map(e => `<blockquote>${esc(e.quote)}</blockquote><div class="src">《${esc(doc(e.doc).title)}》PDF 第 ${e.pg} 页</div>`).join('')}</div>
      <div class="pactions"><button class="primary" data-a="savecard">保存卡片</button><button data-a="canceledit">取消</button></div>`;
  }
  if (sub && sub.type === 'trace') return trace(card(sub.id));
  if (sub && sub.type === 'find') {
    const c = card(sub.id), cand = exR().filter(e => !c.ex.includes(e.id));
    return `<button class="link tiny" data-a="viewcard" data-id="${c.id}">‹ 返回卡片</button><div class="pt" style="margin-top:8px">为「${esc(c.title)}」找依据</div>
      <div class="psub">先看已有摘录。没有合适的，就带着这个问题去读资料：选中句子时可以直接把它作为这张卡片的依据。</div>
      <div class="plist">${cand.map(e => `<div class="it"><blockquote>${esc(e.quote)}</blockquote><div class="ex-meta"><span>${esc(short(doc(e.doc).title))} · 第 ${e.pg} 页</span><button class="link" data-a="attachev" data-id="${e.id}">作为依据</button><button class="link" data-a="jump" data-id="${e.id}">看原文</button></div></div>`).join('') || '<div class="tiny muted">本研究还没有其他摘录</div>'}</div>
      <div class="pactions"><button class="outline sm" data-a="findread">去资料里找</button><button class="sm" data-a="viewcard" data-id="${c.id}">完成</button></div>`;
  }
  if (sub && sub.type === 'view') {
    const c = card(sub.id), ex = c.ex.map(id => S.excerpts.find(e => e.id === id));

      <div class="card-f">${c.review ? '<span class="chip warn">待核查</span>' : '<span class="chip ok">已核查</span>'}${c.place ? `<span class="chip">${ic('board', 11)} ${esc(placeName(c))}</span>` : ''}</div>

function detect(q) {
  if (/arxiv|^\d{4}\.\d{4,5}/i.test(q)) return {type:'arXiv', full:true, sub:'有开放全文：加入后自动下载 PDF，可直接阅读'};
  if (/^10\.\d{4,}\/|doi/i.test(q)) return {type:'DOI', full:false, sub:'加入后自动补全标题与作者；找到开放全文就自动附上，否则先保存文献信息'};
  if (/^https?:\/\//i.test(q)) return /\.pdf($|\?)/i.test(q) ? {type:'PDF 链接', full:true, sub:'加入后下载并保存这份 PDF'} : {type:'网页', full:false, sub:'保存网页标题与链接；可之后补 PDF 或保存网页正文'};
}
function addOptions() {
  const q = S.q.trim(); if (!q) return [];
  const opts = [], id = detect(q);
  if (id) opts.push({a:'addid', icon:id.full ? 'file' : 'link', label:`${id.type} · ${q.replace(/^arxiv:\s*/i, '')}`, sub:id.sub});
  S.docs.filter(d => !d.loading && d.title.includes(q)).forEach(d => opts.push(d.rs.includes(S.research)
    ? {a:'open', k:'doc', id:d.id, icon:'check', label:d.title, sub:'已在本研究中 · 打开'}
    : {a:'libadd', id:d.id, icon:'lib', label:d.title, sub:`资料库已有 · ${d.rs.length ? '用于' + d.rs.map(r => S.researches.find(x => x.id === r).title).join('、') : '未加入研究'} · 复用原文和已有摘录`}));
  if (!id) opts.push({a:'addtitle', icon:'plus', label:`按标题新建「${q}」`, sub:'先保存文献信息，之后在这条资料上补 PDF'});
  return opts;
}

  canceledit:() => { W().sub = null; render(); },
  viewcard:d => { S.placeMenu = null; Object.assign(W(), {panel:'cards', sub:{type:'view', id:d.id}}); render(); },
  subback:() => { W().sub = null; render(); },
  placemenu:(d, e) => { e.stopPropagation(); S.placeMenu = S.placeMenu === d.id ? null : d.id; render(); },
  place:(d, e) => { e.stopPropagation(); const c = card(d.id); c.place = {b:d.b, s:+d.s}; S.placeMenu = null; logIt(`卡片「${c.title}」放入「${placeName(c)}」`); render(); toast(`已放入「${placeName(c)}」`); },
  reviewed:d => { card(d.id).review = false; render(); },
  cite:d => { S.cite = d.id; Object.assign(W(), {panel:'cards', sub:{type:'trace', id:d.id}}); render(); },
  tracecard:d => { S.cite = null; Object.assign(W(), {panel:'cards', sub:{type:'trace', id:d.id}}); render(); },
  insert:d => { const w = S.drafts.find(x => x.id === d.w), c = card(d.id); w.paras.push([c.body.replace(/。$/, ''), {c:c.id}, '。']); render(); toast('已插入观点和引用，编号自动更新'); },
  jump:(d, e) => { e && e.stopPropagation(); const x = S.excerpts.find(y => y.id === d.id); const keep = W().sub; open('doc', x.doc); if (keep && keep.type !== 'edit') { W().panel = 'cards'; W().sub = keep; } S.flash = `${x.doc}:${x.sid}`; S.pick = null; render(); },
  aiadd:() => { S.aiAdded = true; newDoc({full:true, origin:'AI 推荐', ident:'arXiv（示例）', title:'检索器置信度与回答校准'}); logIt('AI 推荐《检索器置信度与回答校准》，已加入本研究'); render(); toast('已加入本研究，正在获取开放 PDF'); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = A[el.dataset.a]; if (f) { f(el.dataset, e); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'add-input') { S.q = e.target.value; document.getElementById('add-results').innerHTML = addResults(); }
  const b = e.target.dataset && e.target.dataset.bind; if (b && W().sub) W().sub[b] = e.target.value;
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === 'Escape') { S.addOpen = S.switchOpen = S.drag = false; S.pick = null; S.placeMenu = null; render(); return; }
  if (e.target.id === 'add-input' && e.key === 'Enter') { const o = addOptions()[0]; if (o) A[o.a]({k:o.k, id:o.id}); return; }
  if (typing) return;
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.a) { e.target.click(); return; }
  if (S.pick && e.key.toLowerCase() === 'h' && !exOf(...S.pick.split(':'))) A.capture();
  else if (S.pick && e.key.toLowerCase() === 'c') A.pickcard();
  else if (e.key.toLowerCase() === 'a' && !S.addOpen && !activeTab() && W().view === 'sources') { e.preventDefault(); A.add(); }
});
render();
